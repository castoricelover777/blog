<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>个人博客源码运行逻辑 · 思维导图</title>
<style>
  :root{
    --bg:#faf9f6; --ink:#111827; --muted:#6b7280;
    --font:"PingFang SC","Microsoft YaHei","Hiragino Sans GB","Noto Sans CJK SC",system-ui,-apple-system,"Segoe UI",sans-serif;
    --shadow:0 1px 2px rgba(17,24,39,.05),0 10px 30px rgba(17,24,39,.07);
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;overflow:hidden}
  body{
    background:var(--bg); color:var(--ink); font-family:var(--font);
    background-image:radial-gradient(circle at 1px 1px,#e6e3dc 1px,transparent 0);
    background-size:24px 24px;
  }
  #app{position:fixed;inset:0}

  .topbar{
    position:fixed;top:0;left:0;right:0;height:60px;z-index:20;
    display:flex;align-items:center;gap:16px;padding:0 20px;
    background:linear-gradient(180deg,rgba(250,249,246,.97),rgba(250,249,246,.80));
    backdrop-filter:blur(10px); border-bottom:1px solid #e8e5de;
  }
  .brand{display:flex;align-items:baseline;gap:9px}
  .brand h1{margin:0;font-size:15.5px;font-weight:800;letter-spacing:.3px}
  .brand .sub{font-size:11px;color:var(--muted);letter-spacing:.4px}
  .spacer{flex:1}
  .btns{display:flex;gap:6px;flex-wrap:wrap}
  button{
    font-family:inherit;font-size:12px;font-weight:600;color:#374151;
    background:#fff;border:1px solid #dedad2;padding:6px 10px;border-radius:7px;
    cursor:pointer;transition:.14s;box-shadow:0 1px 1px rgba(17,24,39,.03);
  }
  button:hover{background:#f2efe9;border-color:#c9c4ba}
  .zoom{display:flex;align-items:center;border:1px solid #dedad2;border-radius:7px;overflow:hidden;background:#fff}
  .zoom button{border:0;border-radius:0;box-shadow:none;padding:6px 9px}
  .zoom .val{font-size:11px;color:var(--muted);padding:0 7px;min-width:42px;text-align:center}

  svg#map{width:100%;height:100%;display:block;cursor:grab}
  svg#map.dragging{cursor:grabbing}
  .node text{font-family:var(--font);dominant-baseline:middle;pointer-events:none}
  .node{cursor:pointer}

  .hint{
    position:fixed;left:20px;bottom:14px;z-index:20;font-size:11px;color:var(--muted);
    background:rgba(255,255,255,.88);border:1px solid #e8e5de;padding:6px 11px;
    border-radius:8px;box-shadow:var(--shadow);
  }
  .hint b{color:#374151}
  .legend{
    position:fixed;right:20px;bottom:14px;z-index:20;display:flex;gap:11px;flex-wrap:wrap;
    max-width:56vw;font-size:10.5px;color:var(--muted);background:rgba(255,255,255,.88);
    border:1px solid #e8e5de;padding:6px 11px;border-radius:8px;box-shadow:var(--shadow);
  }
  .legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px;vertical-align:0}
  /* 学习状态 */
  .stats{display:flex;gap:11px;align-items:center;font-size:11.5px;color:var(--muted);white-space:nowrap}
  .stats b{color:#374151;font-weight:700}
  .stats .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
  .mark{cursor:pointer}
  .mark:hover circle{stroke-width:2.4}
  /* 视图切换 */
  .seg{display:flex;background:#efece6;border:1px solid #dedad2;border-radius:8px;padding:2px;gap:2px}
  .seg a{font-size:12px;font-weight:600;color:#6b7280;text-decoration:none;padding:5px 11px;border-radius:6px;transition:.15s;white-space:nowrap}
  .seg a:hover{color:#374151;background:rgba(255,255,255,.6)}
  .seg a.on{background:#fff;color:#111827;box-shadow:0 1px 3px rgba(17,24,39,.14)}
/* === 移动端顶栏统一修复 v1 === */
@media (max-width: 900px){
  .topbar{height:auto !important;min-height:auto;flex-wrap:wrap;gap:5px;
          padding:6px 8px;overflow-x:hidden}
  .brand{flex:1 0 100%;gap:6px}
  .brand h1{font-size:13.5px;letter-spacing:0}
  .brand .sub{display:none}
  .spacer{display:none}

  /* 切换栏：独占一行，四项平分 */
  .seg{order:1;flex:1 0 100%;display:flex;gap:4px;margin:0 0 3px}
  .seg a{flex:1 1 0;text-align:center;font-size:11.5px;padding:6px 2px;
         white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* 按钮：第二行，横向可滚 */
  .btns{order:2;flex:1 1 auto;flex-wrap:nowrap;overflow-x:auto;gap:4px;
        -webkit-overflow-scrolling:touch}
  .btns::-webkit-scrollbar{display:none}
  button{font-size:11px;padding:5px 8px;border-radius:6px;white-space:nowrap;flex:none}
  .zoom{order:3;flex:none}
  .zoom .val{min-width:34px;font-size:10px}

  .stats{order:9;flex:1 0 100%;justify-content:center;font-size:9.5px;gap:8px}
  .legend{display:none}
  .hint{left:8px;bottom:8px;font-size:10px;padding:4px 8px;max-width:calc(100% - 16px)}
}
@media (max-width: 420px){
  .seg a{font-size:10.5px;padding:6px 1px}
  .brand h1{font-size:12.5px}
}
/* === 移动端切换栏 grid 修复 v2 === */
@media (max-width: 900px){
  .topbar{flex-wrap:wrap !important;height:auto !important;overflow:visible !important;
          padding:6px 8px !important;gap:5px !important}
  .brand{flex:1 0 100% !important;margin-bottom:2px}
  .spacer{display:none !important}

  .seg{display:grid !important;grid-template-columns:repeat(4,1fr) !important;
       gap:4px !important;width:100% !important;flex:1 0 100% !important;
       order:-1 !important;padding:3px !important;box-sizing:border-box}
  .seg a{min-width:0 !important;width:auto !important;flex:none !important;
         text-align:center !important;padding:7px 2px !important;
         font-size:11.5px !important;line-height:1.2;
         white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
         background:transparent;border-radius:6px}
  .seg a.on{background:#fff;box-shadow:0 1px 3px rgba(17,24,39,.14)}

  .btns{flex-wrap:nowrap !important;overflow-x:auto !important;width:100%;
        -webkit-overflow-scrolling:touch}
  .btns::-webkit-scrollbar{display:none}
  button{flex:none;font-size:11px;padding:5px 8px;white-space:nowrap}
  .zoom{flex:none}
  .stats{flex:1 0 100% !important;justify-content:center !important;
         font-size:9.5px !important;gap:8px !important}
  .legend{display:none !important}
  .hint{font-size:10px;left:8px;bottom:8px;padding:4px 8px;max-width:calc(100% - 16px)}
}
@media (max-width: 420px){
  .seg a{font-size:10.5px !important;padding:7px 1px !important}
}
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="brand">
      <h1>个人博客源码运行逻辑</h1>
      <span class="sub">JavaBlog 全栈项目 · 从启动到部署</span>
    </div>
    <div class="spacer"></div>
    <div class="seg">
      <a href="index.html">思维导图</a>
      <a href="chain.html">长链图</a>
      <a class="on">博客源码</a>
      <a href="llm.html">数据分析</a>
    </div>
    <div class="btns">
      <button id="btn-expand">全部展开</button>
      <button id="btn-collapse">只看阶段</button>
      <button id="btn-items">展开到环节</button>
      <button id="btn-fit">适应窗口</button>
    </div>
    <div class="stats" id="stats"></div>
    <button id="btn-export">导出标记</button>
    <button id="btn-import">导入标记</button>
    <input type="file" id="file-import" accept=".json,application/json" style="display:none">
    <button id="btn-reset">清空标记</button>
    <div class="zoom">
      <button id="btn-out">−</button><span class="val" id="zoomval">100%</span><button id="btn-in">+</button>
    </div>
  </div>
  <svg id="map"><g id="scene"></g></svg>
  <div class="hint"><b>点击节点</b>展开/折叠 · <b>滚轮</b>缩放 · <b>拖拽</b>平移</div>
  <div class="legend" id="legend"></div>
</div>

<script>
const DATA = {"t": "个人博客源码运行逻辑", "c": [{"t": "阶段〇：全景速览（先建立全局认知）", "c": [{"t": "0.1 一句话主线：打开网页 → main.js 把 Vue 应用挂到 #app → init() 先读缓存 → 探测有没有后端 → 取数据 → 归一化加工 → Vue 响应式渲染；后端那一侧启动 Tomcat → Controller 接请求 → Service 校验 → JdbcNoteDao 查 MySQL → 返回 JSON", "c": [], "color": "#475569"}, {"t": "0.2 技术栈实名（不是泛泛而谈）", "c": [{"t": "前端：Vue 3 ESM 浏览器版（vendor/vue.esm-browser.prod.js）+ 原生 ES Module，共 7 个 js 模块", "c": [], "color": "#475569"}, {"t": "后端：Spring Boot 3.5 + Spring MVC + JdbcTemplate + HikariCP，15 个源文件", "c": [], "color": "#475569"}, {"t": "数据库：MySQL 8.4，表 note（8 个字段 + 2 个索引），51 行数据", "c": [], "color": "#475569"}], "color": "#475569"}, {"t": "0.3 两套运行形态", "c": [{"t": "本地全栈形态：前端 + SpringBoot + MySQL 全在，mode='api'，可以增删改，数据落库", "c": [], "color": "#475569"}, {"t": "线上静态形态：只有前端 + data/notes.json，mode='static'，只读，GitHub Pages 用这个形态", "c": [], "color": "#475569"}], "color": "#475569"}, {"t": "0.4 代码规模", "c": [{"t": "前端：index.html 131 行、app.js 340 行、data.js 213 行、api.js 150 行、storage.js 113 行、dates.js 70 行、utils.js 75 行、main.js 22 行", "c": [], "color": "#475569"}, {"t": "后端：NoteController 142 行、NoteService 187 行、JdbcNoteDao 121 行、NoteDao 39 行、WebConfig 81 行、NoteSeeder 87 行、ApiExceptionHandler 59 行", "c": [], "color": "#475569"}], "color": "#475569"}, {"t": "0.5 模块依赖图（谁 import 谁）", "c": [{"t": "入口层：index.html 只引一个脚本：js/main.js", "c": [], "color": "#475569"}, {"t": "main.js 的两条依赖：import { createApp } from './vendor/vue.esm-browser.prod.js'；import { createBlogApp } from './app.js'", "c": [], "color": "#475569"}, {"t": "app.js 的依赖：依赖 api.js（数据）、data.js（加工）、storage.js（缓存）、dates.js（日期）、utils.js（转义）", "c": [], "color": "#475569"}, {"t": "关键设计：app.js 只\"定义应用\"（导出 createBlogApp 工厂），main.js 才\"挂载应用\"，这样测试可以在 jsdom 里挂载而不碰真实页面", "c": [], "color": "#475569"}], "color": "#475569"}], "color": "#475569"}, {"t": "阶段一：index.html 骨架", "c": [{"t": "1.1 单页结构", "c": [{"t": "知识点：SPA 单页——整个站点只有一个 HTML，页面切换靠 Vue 改 DOM，不刷新", "c": [], "color": "#2563EB"}, {"t": "详细过程：浏览器请求 / → 返回 index.html → 解析出 6 个关键挂载点", "c": [], "color": "#2563EB"}], "color": "#2563EB"}, {"t": "1.2 六个关键 DOM 节点", "c": [{"t": "清单：#app（Vue 挂载根）、#search（搜索框）、#cats（分类列表）、#list（笔记列表）、#content（详情区）、#catList（分类下拉）", "c": [], "color": "#2563EB"}, {"t": "关键细节：Vue 通过 mount('#app') 接管 #app 内部，所有渲染都在它里面完成", "c": [], "color": "#2563EB"}], "color": "#2563EB"}, {"t": "1.3 只引一个脚本", "c": [{"t": "知识点：ES Module 入口——index.html 里只有 <script type=\"module\" src=\"js/main.js\">，其余模块由 main.js 用 import 串起来", "c": [], "color": "#2563EB"}, {"t": "关键细节：type=\"module\" 是必须的，否则 import 语法不生效；同时模块默认严格模式、默认延迟执行", "c": [], "color": "#2563EB"}], "color": "#2563EB"}, {"t": "1.4 Vue 用本地 vendor 而不是 CDN", "c": [{"t": "知识点：离线可用——vendor/vue.esm-browser.prod.js 放在仓库里，断网也能打开，不依赖 CDN", "c": [], "color": "#2563EB"}, {"t": "关键细节：用相对路径 './vendor/vue.esm-browser.prod.js' 而不是裸名 'vue'，浏览器和 Node 都能直接解析", "c": [], "color": "#2563EB"}], "color": "#2563EB"}], "color": "#2563EB"}, {"t": "阶段二：main.js 挂载（只有 3 行有效代码）", "c": [{"t": "2.1 导入 Vue", "c": [{"t": "代码：import { createApp } from './vendor/vue.esm-browser.prod.js';", "c": [], "color": "#0E7490"}, {"t": "说明：拿到 Vue 的 createApp 工厂函数，后面交给 app.js 用", "c": [], "color": "#0E7490"}], "color": "#0E7490"}, {"t": "2.2 导入应用工厂", "c": [{"t": "代码：import { createBlogApp } from './app.js';", "c": [], "color": "#0E7490"}, {"t": "说明：createBlogApp 是\"应用定义\"，还没执行任何副作用", "c": [], "color": "#0E7490"}], "color": "#0E7490"}, {"t": "2.3 挂载", "c": [{"t": "代码：createBlogApp({ createApp }).mount('#app');", "c": [], "color": "#0E7490"}, {"t": "详细过程：把 createApp 作为依赖注入给工厂 → 工厂内部创建 Vue 应用 → mount 到 #app → 触发 init() 发请求", "c": [], "color": "#0E7490"}], "color": "#0E7490"}, {"t": "2.4 为什么\"定义\"和\"挂载\"要分开", "c": [{"t": "知识点：副作用隔离——挂载会操作真实 DOM、发真实请求；分开后测试可以直接 import app.js 的工厂，挂到 jsdom 假页面上，用假 fetch 喂数据", "c": [], "color": "#0E7490"}, {"t": "关键细节：这就是 Vue 项目里 main.js 与 App.vue 分开的同一个理由", "c": [], "color": "#0E7490"}], "color": "#0E7490"}], "color": "#0E7490"}, {"t": "阶段三：api.js 数据源判定（双模式核心）", "c": [{"t": "3.1 mode 状态机", "c": [{"t": "知识点：三态 loadData → 得到 notes.json → 替换 data/notes.json → git push → Actions 部署 → 线上读新文件", "c": [], "color": "#0E7490"}], "color": "#0E7490"}, {"t": "13.8 静态模式下的降级", "c": [{"t": "步骤：detectMode 超时 → mode='static' → fetchNotes 读 data/notes.json → isReadOnly=true → 写按钮隐藏 → 顶部显示\"静态只读\"横幅", "c": [], "color": "#0E7490"}], "color": "#0E7490"}], "color": "#0E7490"}], "color": "#111827"};

const FS   = {0:17, 1:13.5, 2:12, 3:11};
const PADX = {0:22, 1:15, 2:12, 3:10};
const PADY = {0:15, 1:10, 2:7.5, 3:6.5};
const GAPY = {0:22, 1:9, 2:5, 3:4};
const GAPX = {0:78, 1:52, 2:40, 3:34};
const MAXW = {0:360, 1:300, 2:300, 3:400};
const MAXL = {0:1, 1:2, 2:2, 3:3};

function isCJK(ch){ return /[\u3000-\u303f\u4e00-\u9fff\uff00-\uffef]/.test(ch); }
function textW(s, fs){ let w=0; for(const ch of s) w += isCJK(ch)?fs:fs*0.56; return w; }

function wrap(text, level){
  const fs = FS[level], budget = MAXW[level], maxL = MAXL[level];
  const chars = [...text], lines = [];
  let cur = "";
  for (const ch of chars){
    if (cur && textW(cur+ch, fs) > budget){
      lines.push(cur); cur = ch;
      if (lines.length >= maxL) break;
    } else cur += ch;
  }
  if (lines.length < maxL && cur) lines.push(cur);
  let used = lines.join("").length;
  if (used < chars.length && lines.length){
    let last = lines[lines.length-1];
    while (last.length > 1 && textW(last+"…", fs) > budget) last = last.slice(0,-1);
    lines[lines.length-1] = last + "…";
  }
  return lines;
}

const state = { collapsed:new Set(), scale:1, tx:0, ty:0, right:[], left:[], rootNode:null };

/* ===== 学习状态标记：0=未标记 1=不会(红) 2=仅了解(黄) 3=理解(绿) ===== */
const MARK_COLORS = ["#9ca3af", "#DC2626", "#F59E0B", "#16A34A"];
const MARK_TINTS  = ["#ffffff", "#FEF2F2", "#FFFBEB", "#F0FDF4"];
const MARK_NAMES  = ["未标记", "不会", "仅了解", "理解"];
const LS_KEY = "mm-marks-blog-v1";
try { state.marks = JSON.parse(localStorage.getItem(LS_KEY) || "{}") || {}; }
catch (e) { state.marks = {}; }
function saveMarks(){ try { localStorage.setItem(LS_KEY, JSON.stringify(state.marks)); } catch(e){} }
function markOf(n){ return state.marks[n._path] || 0; }
function cycleMark(n){
  const next = (markOf(n) + 1) % 4;
  if (next === 0) delete state.marks[n._path];
  else state.marks[n._path] = next;
  saveMarks();
  render(true);        // true = 保持当前缩放/平移，不重新适配
  updateStats();
}
function updateStats(){
  const c = [0,0,0,0];
  const walk = (n) => { if (!(n.c && n.c.length)) c[markOf(n)]++; (n.c||[]).forEach(walk); };
  walk(DATA);
  const box = document.getElementById("stats");
  if (!box) return;
  box.innerHTML =
      `<span><i class="dot" style="background:${MARK_COLORS[1]}"></i>不会 <b>${c[1]}</b></span>`
    + `<span><i class="dot" style="background:${MARK_COLORS[2]}"></i>仅了解 <b>${c[2]}</b></span>`
    + `<span><i class="dot" style="background:${MARK_COLORS[3]}"></i>理解 <b>${c[3]}</b></span>`
    + `<span style="opacity:.65">未标记 <b>${c[0]}</b></span>`;
}

function measure(node, level, path){
  node._level = level;
  node._path = path;
  node._lines = wrap(node.t, level);
  node._w = Math.max(...node._lines.map(l => textW(l, FS[level]))) + PADX[level]*2;
  node._h = node._lines.length * (FS[level]*1.4) + PADY[level]*2;
  node._open = !state.collapsed.has(node) && node.c && node.c.length > 0;
  if (node._open) node.c.forEach((ch,i) => measure(ch, level+1, path + "-" + i));
}

/* 一侧布局：dir=+1 向右，dir=-1 向左。返回该侧高度 */
function layoutSide(nodes, dir, x0){
  let cursor = 0;
  function place(node, level, colX){
    // colX: 该节点列的「锚点」：右向为左边缘，左向为右边缘
    node._dir = dir;
    if (dir > 0){ node._x = colX; }
    else { node._x = colX - node._w; }
    if (!node._open || !node.c || !node.c.length){
      node._y = cursor;
      cursor += node._h + GAPY[Math.min(level,3)];
      return node._y + node._h/2;
    }
    const nextX = dir > 0
      ? colX + node._w + GAPX[Math.min(level,3)]
      : colX - node._w - GAPX[Math.min(level,3)];
    const centers = node.c.map(ch => place(ch, level+1, nextX));
    node._y = (Math.min(...centers) + Math.max(...centers))/2 - node._h/2;
    return node._y + node._h/2;
  }
  nodes.forEach(st => place(st, 1, x0));
  return { height: cursor };
}

function collect(node, out){
  out.push(node);
  if (node._open) node.c.forEach(ch => collect(ch, out));
  return out;
}

function assignPaths(node, path){
  node._path = path;
  (node.c||[]).forEach((ch,i) => assignPaths(ch, path + "-" + i));
}

function build(){
  // 0. 先给全部节点分配路径（折叠的也要有，否则标记会串号）
  assignPaths(DATA, "r");
  // 1. 测量
  measure(DATA, 0, "r");
  // 2. 分左右（交替）
  const rightStages = [], leftStages = [];
  DATA.c.forEach((st, i) => { (i % 2 === 0 ? rightStages : leftStages).push(st); });
  // 3. 两侧布局（先在各自局部坐标）
  const R = layoutSide(rightStages, +1, 0);
  const L = layoutSide(leftStages, -1, 0);

  // 左内侧的局部 x 范围：最右是 0，最左是负值
  let leftMinX = 0, rightMaxX = 0;
  const walkX = (n, pick) => { pick(n); if (n._open) n.c.forEach(ch => walkX(ch, pick)); };
  leftStages.forEach(st => walkX(st, n => { leftMinX = Math.min(leftMinX, n._x); }));
  rightStages.forEach(st => walkX(st, n => { rightMaxX = Math.max(rightMaxX, n._x + n._w); }));

  const leftW = -leftMinX;
  const gapR = GAPX[0], rootW = DATA._w;
  // 水平位移：左侧整体平移到 0 起，根紧随其后
  const shiftLeft = leftW;
  const rootX = leftW + gapR;
  const shiftRight = rootX + rootW + gapR;

  const shiftSide = (stages, dx, dy) => {
    stages.forEach(st => {
      const walk = n => { n._x += dx; n._y += dy; if (n._open) n.c.forEach(walk); };
      walk(st);
    });
  };

  const H = Math.max(R.height, L.height);
  // 垂直居中：两侧各自居中
  const dyR = (H - R.height) / 2;
  const dyL = (H - L.height) / 2;
  shiftSide(rightStages, shiftRight, dyR);
  shiftSide(leftStages, shiftLeft, dyL);

  DATA._x = rootX;
  DATA._y = H/2 - DATA._h/2;

  // 收集所有可见节点
  const nodes = [];
  collect(DATA, nodes);

  return { nodes, rootX, rootW, totalH: H };
}

/* ---------- 渲染 ---------- */
const NS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("map");
const scene = document.getElementById("scene");
function el(tag, attrs){ const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; }

function render(keepView){
  const keep = keepView ? { s:state.scale, x:state.tx, y:state.ty } : null;
  const { nodes } = build();
  scene.innerHTML = "";

  const gE = el("g", {});
  const drawEdge = (p, c) => {
    const px = p._dir > 0 ? p._x + p._w : p._x;
    const py = p._y + p._h/2;
    const cx = c._dir > 0 ? c._x : c._x + c._w;
    const cy = c._y + c._h/2;
    const mx = (px + cx) / 2;
    gE.appendChild(el("path", {
      d:`M ${px} ${py} C ${mx} ${py}, ${mx} ${cy}, ${cx} ${cy}`,
      fill:"none", stroke:c.color || "#9ca3af",
      "stroke-width": c._level === 1 ? 2 : 1.2,
      "stroke-linecap":"round",
      opacity: c._level === 1 ? .9 : .5
    }));
  };
  nodes.forEach(n => { if (n._open && n.c) n.c.forEach(ch => drawEdge(n, ch)); });
  scene.appendChild(gE);

  const gN = el("g", {});
  nodes.forEach(n => {
    const lv = n._level;
    const g = el("g", { class:"node" });
    const isRoot = lv === 0;
    const isLeaf = !(n.c && n.c.length);
    const mk = (!isRoot && isLeaf) ? markOf(n) : 0;
    const fill0 = isRoot ? "#111827" : (lv === 1 ? (n.color || "#334155") : "#ffffff");
    const stroke0 = isRoot ? "#111827" : (lv === 1 ? (n.color || "#334155")
                   : (lv === 2 ? (n.color || "#d6d3ce") : (n.color || "#d6d3ce")));
    const rect = el("rect", {
      x:n._x, y:n._y, width:n._w, height:n._h,
      rx: isRoot ? 12 : 8,
      fill: mk ? MARK_TINTS[mk] : fill0,
      stroke: mk ? MARK_COLORS[mk] : stroke0,
      "stroke-width": mk ? 1.8 : (lv === 1 ? 0 : (lv === 2 ? 1.1 : 0.9)),
      "stroke-opacity": mk ? 1 : (lv >= 3 ? .35 : 1)
    });
    if (lv === 2 && !mk) rect.setAttribute("stroke-opacity", ".55");
    g.appendChild(rect);

    const fs = FS[lv], lh = fs*1.4;
    const totalH = n._lines.length * lh;
    const startY = n._y + (n._h - totalH)/2 + lh/2;
    n._lines.forEach((line, i) => {
      const t = el("text", {
        y: startY + i*lh,
        "font-size": fs,
        "font-weight": isRoot ? 800 : (lv === 1 ? 700 : (lv === 2 ? 600 : 400)),
        fill: isRoot ? "#ffffff" : (lv === 1 ? "#ffffff" : (lv === 2 ? "#1f2937" : "#4b5563"))
      });
      if (n._dir > 0 && !isRoot){
        t.setAttribute("x", n._x + PADX[lv]);
        t.setAttribute("text-anchor", "start");
      } else if (n._dir < 0 && !isRoot){
        t.setAttribute("x", n._x + n._w - PADX[lv]);
        t.setAttribute("text-anchor", "end");
      } else {
        t.setAttribute("x", n._x + PADX[lv]);
        t.setAttribute("text-anchor", "start");
      }
      t.textContent = line;
      g.appendChild(t);
    });

    if (n.c && n.c.length){
      const cx = n._dir > 0 || isRoot ? n._x + n._w + 12 : n._x - 12;
      const cy = n._y + n._h/2;
      g.appendChild(el("circle", { cx, cy, r:7.5, fill:"#fff",
        stroke:n.color || "#9ca3af", "stroke-width":1.2 }));
      const tt = el("text", { x:cx, y:cy+0.5, "text-anchor":"middle",
        "font-size":9.5, "font-weight":700, fill:n.color || "#9ca3af" });
      tt.textContent = n._open ? "−" : String(n.c.length);
      g.appendChild(tt);
    } else {
      /* ----- 叶子节点：学习状态小圆按钮 ----- */
      const cx = (n._dir > 0 || isRoot) ? n._x + n._w + 12 : n._x - 12;
      const cy = n._y + n._h/2;
      const gm = el("g", { class:"mark" });
      gm.appendChild(el("circle", {
        cx, cy, r:8,
        fill: mk ? MARK_COLORS[mk] : "#ffffff",
        stroke: mk ? MARK_COLORS[mk] : "#c3c9d2",
        "stroke-width": mk ? 1 : 1.3,
        "stroke-dasharray": mk ? "0" : "2.2 2.2"
      }));
      if (mk){
        const chk = el("text", {
          x:cx, y:cy+0.6, "text-anchor":"middle",
          "font-size":9, "font-weight":800, fill:"#ffffff"
        });
        chk.textContent = mk === 3 ? "✓" : (mk === 2 ? "~" : "✕");
        gm.appendChild(chk);
      }
      const ttl = el("title", {});
      ttl.textContent = `【${MARK_NAMES[mk]}】点击切换：不会 → 仅了解 → 理解 → 取消`;
      gm.appendChild(ttl);
      gm.addEventListener("click", ev => { ev.stopPropagation(); cycleMark(n); });
      g.appendChild(gm);
    }

    const title = el("title", {}); title.textContent = n.t; g.appendChild(title);
    g.addEventListener("click", ev => {
      ev.stopPropagation();
      if (n.c && n.c.length){
        if (state.collapsed.has(n)) state.collapsed.delete(n); else state.collapsed.add(n);
        renderKeepNode(n);
      }
    });
    gN.appendChild(g);
  });
  scene.appendChild(gN);
  if (keep){ state.scale = keep.s; state.tx = keep.x; state.ty = keep.y; apply(); }
  else fit();
  buildLegend();
  updateStats();
}

/* ---------- 保持视图的局部重绘：展开/折叠后不重置缩放，且把被点的节点钉在原处 ---------- */
function renderKeepNode(n){
  if (!n || n._x == null || n._y == null){ render(true); return; }
  const ax = state.tx + n._x * state.scale;
  const ay = state.ty + n._y * state.scale;
  render(true);
  if (n._x == null || n._y == null) return;
  state.tx += ax - (state.tx + n._x * state.scale);
  state.ty += ay - (state.ty + n._y * state.scale);
  apply();
}

/* ---------- 缩放/平移 ---------- */
function apply(){
  scene.setAttribute("transform", `translate(${state.tx},${state.ty}) scale(${state.scale})`);
  document.getElementById("zoomval").textContent = Math.round(state.scale*100) + "%";
}
function fit(){
  const bb = scene.getBBox();
  if (!bb.width) return;
  const W = svg.clientWidth, H = svg.clientHeight;
  const padX = 70, padTop = 86, padBottom = 62;
  const s = Math.min((W - padX*2)/bb.width, (H - padTop - padBottom)/bb.height, 1.25);
  state.scale = Math.max(s, 0.1);
  state.tx = (W - bb.width*state.scale)/2 - bb.x*state.scale;
  state.ty = padTop + (H - padTop - padBottom - bb.height*state.scale)/2 - bb.y*state.scale;
  apply();
}

svg.addEventListener("wheel", e => {
  e.preventDefault();
  const r = svg.getBoundingClientRect();
  const mx = e.clientX - r.left, my = e.clientY - r.top;
  const k = e.deltaY < 0 ? 1.12 : 1/1.12;
  const ns = Math.min(Math.max(state.scale*k, 0.06), 3);
  const q = ns/state.scale;
  state.tx = mx - (mx-state.tx)*q;
  state.ty = my - (my-state.ty)*q;
  state.scale = ns; apply();
}, { passive:false });

let drag=false, lx=0, ly=0;
svg.addEventListener("mousedown", e => { drag=true; lx=e.clientX; ly=e.clientY; svg.classList.add("dragging"); });
window.addEventListener("mousemove", e => {
  if(!drag) return;
  state.tx += e.clientX-lx; state.ty += e.clientY-ly; lx=e.clientX; ly=e.clientY; apply();
});
window.addEventListener("mouseup", () => { drag=false; svg.classList.remove("dragging"); });

function buildLegend(){
  const box = document.getElementById("legend"); box.innerHTML = "";
  DATA.c.forEach(st => {
    const s = document.createElement("span");
    s.innerHTML = `<i style="background:${st.color}"></i>${st.t.split("：")[0]}`;
    box.appendChild(s);
  });
}

function setAll(fn){
  const walk = (n, d) => { if (fn(n, d)) state.collapsed.add(n); else state.collapsed.delete(n);
                           (n.c||[]).forEach(ch => walk(ch, d+1)); };
  walk(DATA, 0);
  state.collapsed.delete(DATA);
  render();
}
document.getElementById("btn-expand").onclick = () => setAll(() => false);
document.getElementById("btn-collapse").onclick = () => setAll((n,d) => d >= 1);
document.getElementById("btn-items").onclick = () => setAll((n,d) => d >= 2);
document.getElementById("btn-fit").onclick = () => render();
document.getElementById("btn-in").onclick = () => { state.scale = Math.min(state.scale*1.18,3); apply(); };
document.getElementById("btn-out").onclick = () => { state.scale = Math.max(state.scale/1.18,0.06); apply(); };
document.getElementById("btn-reset").onclick = () => {
  if (!confirm("确定清空所有学习状态标记？")) return;
  state.marks = {}; saveMarks(); render(true); updateStats();
};

/* ===== 标记导出 / 导入：用于同步到 U 盘 ===== */
function exportMarks(){
  const keys = Object.keys(state.marks);
  const payload = {
    app: "前后端数据沟通全链路-学习标记",
    version: 1,
    exportedAt: new Date().toISOString(),
    total: keys.length,
    marks: state.marks
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const d = new Date();
  const ymd = d.getFullYear() + "-" +
              String(d.getMonth()+1).padStart(2,"0") + "-" +
              String(d.getDate()).padStart(2,"0");
  const a = document.createElement("a");
  a.href = url;
  a.download = "学习标记-" + ymd + ".json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
  alert("已导出 " + keys.length + " 条标记\n\n文件名：学习标记-" + ymd + ".json\n（在浏览器下载目录里）\n\n把它拷到 U 盘，换电脑时用「导入标记」恢复。");
}

function importMarks(file){
  const fr = new FileReader();
  fr.onload = () => {
    try {
      const obj = JSON.parse(fr.result);
      const marks = obj.marks || obj;
      if (typeof marks !== "object" || marks === null || Array.isArray(marks)) throw new Error("不是有效的标记文件");
      const keys = Object.keys(marks).filter(k => /^r(-\d+)+$/.test(k) && marks[k] >= 1 && marks[k] <= 3);
      if (!keys.length) throw new Error("文件里没有可用的标记");
      if (!confirm("将导入 " + keys.length + " 条标记。\n\n规则：同一知识点以导入文件为准，其余保留你当前的标记。\n\n继续？")) return;
      keys.forEach(k => { state.marks[k] = marks[k]; });
      saveMarks(); render(true); updateStats();
      alert("导入完成。\n当前共 " + Object.keys(state.marks).length + " 条标记。");
    } catch (e) {
      alert("导入失败：" + e.message + "\n\n请确认选的是「导出标记」生成的 json 文件。");
    }
  };
  fr.readAsText(file, "utf-8");
}

document.getElementById("btn-export").onclick = exportMarks;
document.getElementById("btn-import").onclick = () => document.getElementById("file-import").click();
document.getElementById("file-import").addEventListener("change", ev => {
  const f = ev.target.files && ev.target.files[0];
  if (f) importMarks(f);
  ev.target.value = "";
});


/* 初始视图：默认「展开到环节」；可用 ?view=all|collapse|items 指定 */
(function(){
  state.collapsed.clear();
  const v = (new URLSearchParams(location.search)).get("view") || "items";
  const walk = (n, d) => { if (d >= 2) state.collapsed.add(n); (n.c||[]).forEach(ch => walk(ch, d+1)); };
  if (v === "items"){
    DATA.c.forEach(st => walk(st, 1));
  } else if (v === "all"){
    /* 什么都不折叠 */
  } else if (v === "collapse"){
    DATA.c.forEach(st => state.collapsed.add(st));
  }
})();
render();
window.addEventListener("resize", () => { clearTimeout(window._t); window._t = setTimeout(apply, 120); });
</script>
</body>
