<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>前后端数据沟通全链路 · 链路图</title>
<style>
  :root{
    --bg:#fbfaf7; --ink:#111827; --muted:#6b7280;
    --font:"PingFang SC","Microsoft YaHei","Hiragino Sans GB","Noto Sans CJK SC",system-ui,-apple-system,"Segoe UI",sans-serif;
    --shadow:0 1px 2px rgba(17,24,39,.05),0 8px 24px rgba(17,24,39,.06);
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;overflow:hidden}
  body{
    background:var(--bg);color:var(--ink);font-family:var(--font);
    background-image:radial-gradient(circle at 1px 1px,#e7e4dd 1px,transparent 0);
    background-size:24px 24px;
  }
  #app{position:fixed;inset:0}
  .topbar{
    position:fixed;top:0;left:0;right:0;height:58px;z-index:20;
    display:flex;align-items:center;gap:14px;padding:0 20px;
    background:linear-gradient(180deg,rgba(251,250,247,.97),rgba(251,250,247,.82));
    backdrop-filter:blur(10px);border-bottom:1px solid #e8e5de;
  }
  .brand h1{margin:0;font-size:15.5px;font-weight:800;letter-spacing:.3px;display:inline}
  .brand .sub{font-size:11px;color:var(--muted);margin-left:9px;letter-spacing:.3px}
  .spacer{flex:1}
  .btns{display:flex;gap:6px}
  button{
    font-family:inherit;font-size:12px;font-weight:600;color:#374151;background:#fff;
    border:1px solid #dedad2;padding:6px 10px;border-radius:7px;cursor:pointer;
    transition:.14s;box-shadow:0 1px 1px rgba(17,24,39,.03);
  }
  button:hover{background:#f2efe9;border-color:#c9c4ba}
  .zoom{display:flex;align-items:center;border:1px solid #dedad2;border-radius:7px;overflow:hidden;background:#fff}
  .zoom button{border:0;border-radius:0;box-shadow:none;padding:6px 9px}
  .zoom .val{font-size:11px;color:var(--muted);padding:0 7px;min-width:42px;text-align:center}
  svg#map{width:100%;height:100%;display:block;cursor:grab}
  svg#map.dragging{cursor:grabbing}
  text{font-family:var(--font);dominant-baseline:middle;pointer-events:none}
  .hint{
    position:fixed;left:20px;bottom:14px;font-size:11px;color:var(--muted);z-index:20;
    background:rgba(255,255,255,.88);border:1px solid #e8e5de;padding:6px 11px;
    border-radius:8px;box-shadow:var(--shadow);
  }
  .hint b{color:#374151}
  /* 学习状态 */
  .stats{display:flex;gap:11px;align-items:center;font-size:11.5px;color:#6b7280;white-space:nowrap}
  .stats b{color:#374151;font-weight:700}
  .stats .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
  .mk{cursor:pointer}
  .mk:hover circle{stroke-width:2.6}
  /* 视图切换 */
  .seg{display:flex;background:#efece6;border:1px solid #dedad2;border-radius:8px;padding:2px;gap:2px}
  .seg a{font-size:12px;font-weight:600;color:#6b7280;text-decoration:none;padding:5px 11px;border-radius:6px;transition:.15s;white-space:nowrap}
  .seg a:hover{color:#374151;background:rgba(255,255,255,.6)}
  .seg a.on{background:#fff;color:#111827;box-shadow:0 1px 3px rgba(17,24,39,.14)}
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="brand">
      <h1>前后端数据沟通全链路</h1><span class="sub">用户注册案例 · 一条链走完 6 个阶段</span>
    </div>
    <div class="spacer"></div>
    <div class="seg">
      <a href="index.html">思维导图</a>
      <a class="on">长链图</a>
    </div>
    <div class="btns">
      <button id="btn-expand">展开细节</button>
      <button id="btn-items">展开到环节</button>
      <button id="btn-collapse">只看阶段</button>
      <button id="btn-fit">适应窗口</button>
    </div>
    <div class="stats" id="stats"></div>
    <button id="btn-author" title="把作者内置的标记载入到当前浏览器">载入作者标记</button>
      <button id="btn-export">导出标记</button>
    <button id="btn-import">导入标记</button>
    <input type="file" id="file-import" accept=".json,application/json" style="display:none">
    <button id="btn-reset">清空标记</button>
    <div class="zoom">
      <button id="btn-out">−</button><span class="val" id="zoomval">100%</span><button id="btn-in">+</button>
    </div>
  </div>
  <svg id="map"><defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arwR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#cbb8a6"/>
    </marker>
  </defs><g id="scene"></g></svg>
  <div class="hint"><b>点阶段</b>收起/展开环节 · <b>点环节</b>看细节 · <b>滚轮</b>缩放 · <b>拖拽</b>平移</div>
</div>

<script>
const DATA = {"main": [{"idx": 1, "title": "阶段一：前端数据采集与发送（HTML + Vue + Axios）", "color": "#2563EB", "items": [{"t": "1.1 HTML 表单：先把「容器」搭好", "p": "r-1-0", "details": [{"t": "知识点：HTML 表单元素——form 标签负责把一组输入框聚合成一次「提交」；input 负责采集单个字段", "p": "r-1-0-0"}, {"t": "详细过程：页面里先写好结构：一个用户名输入框、一个密码输入框、一个注册按钮", "p": "r-1-0-1"}, {"t": "关键细节：type=\"text\" 是明文；type=\"password\" 输入时显示圆点但值仍是明文，加密必须靠后端", "p": "r-1-0-2"}, {"t": "关键细节：input 必须绑定一个「归宿」——在 Vue 里就是 data 中的字段，否则输入的值抓不到", "p": "r-1-0-3"}, {"t": "常见坑：input 忘了写 v-model，用户输入了但 form.username 一直是空字符串", "p": "r-1-0-4"}]}, {"t": "1.2 Vue 的 v-model：把输入框和 data 焊在一起", "p": "r-1-1", "details": [{"t": "知识点：v-model 双向绑定——它是语法糖，等价于 :value + @input 的合体", "p": "r-1-1-0"}, {"t": "拆开看本质：一是「数据 → 视图」：data 变了，输入框的值跟着变", "p": "r-1-1-1"}, {"t": "拆开看本质：二是「视图 → 数据」：用户敲键盘触发 input 事件，Vue 自动把新值写回 data", "p": "r-1-1-2"}, {"t": "详细过程：写 v-model=\"form.username\"，用户每敲一个字符，form.username 立刻同步更新，不需要手动读 DOM", "p": "r-1-1-3"}, {"t": "为什么不用 document.getElementById：手动取 DOM 要自己监听事件、自己赋值、还得处理中文输入法组合态；v-model 全部替你做了", "p": "r-1-1-4"}, {"t": "常见坑：v-model 绑定到一个未在 data 里声明的字段，Vue3 下会不响应（要先声明）", "p": "r-1-1-5"}]}, {"t": "1.3 前端校验：能在这里拦住的就不要发网络请求", "p": "r-1-2", "details": [{"t": "知识点：表单校验——校验越靠前越省钱——前端拦住一次，就省一次网络往返 + 一次后端处理 + 一次数据库查询", "p": "r-1-2-0"}, {"t": "详细过程：点注册前先判断：用户名非空、长度 3~20、密码长度不少于 6 位；不通过就直接提示，不发请求", "p": "r-1-2-1"}, {"t": "关键细节：前端校验只提升体验，不能当安全防线——用户可以绕过前端直接调接口，所以后端必须再校验一遍", "p": "r-1-2-2"}, {"t": "对应到本项目：知识库后端的 Service 层就写了「标题不能为空 / 分类不能为空 / 正文不能为空」的校验，和前端校验是两道关卡", "p": "r-1-2-3"}]}, {"t": "1.4 @click 事件：真正的触发点", "p": "r-1-3", "details": [{"t": "知识点：Vue 事件绑定 @click——v-on:click 的简写，把「点击」这个 DOM 事件绑到 methods 里的一个方法上", "p": "r-1-3-0"}, {"t": "详细过程：给注册按钮写 @click=\"register\"，点击时调用 register() 方法", "p": "r-1-3-1"}, {"t": "为什么触发的是方法而不是直接发请求：把「事件」和「请求」拆开，好处是方法里可以先校验、可以置 loading、可以防重复提交", "p": "r-1-3-2"}, {"t": "关键细节：若用 form 原生提交，要写 @submit.prevent，否则浏览器会刷新整页，Ajax 白写", "p": "r-1-3-3"}, {"t": "常见坑：按钮写在 form 里但没写 type=\"button\"，点一下触发表单默认提交，页面闪一下刷新", "p": "r-1-3-4"}, {"t": "常见坑：防重复提交：点完没禁用按钮，用户连点三次就注册了三条记录", "p": "r-1-3-5"}]}, {"t": "1.5 组装参数：JS 对象是这一层的通用货币", "p": "r-1-4", "details": [{"t": "知识点：JS 对象 / 字面量——前端发出去的不是「两个变量」，而是一个结构化的对象", "p": "r-1-4-0"}, {"t": "详细过程：方法里组装 const data = { username: form.username, password: form.password }", "p": "r-1-4-1"}, {"t": "关键细节：字段名必须和后端 Java 实体类的属性名一致——这是前后端唯一的「口头约定」，对不上后端收到 null", "p": "r-1-4-2"}, {"t": "关键细节：不要直接把 form 整个发过去，可能夹带无关字段（比如确认密码），后端要么忽略要么报错", "p": "r-1-4-3"}]}, {"t": "1.6 Axios 的 POST 请求：把对象变成网络报文", "p": "r-1-5", "details": [{"t": "知识点：axios.post——axios.post(url, data) 发一个 POST 请求", "p": "r-1-5-0"}, {"t": "详细过程：调用 axios.post('/api/users/register', data)，url 里的 /api 是后端统一前缀", "p": "r-1-5-1"}, {"t": "关键细节：Axios 自动做了两件事——一是把 JS 对象序列化成 JSON 字符串", "p": "r-1-5-2"}, {"t": "关键细节：Axios 自动做了两件事——二是自动设置请求头 Content-Type: application/json", "p": "r-1-5-3"}, {"t": "如果手写原生 fetch 会怎样：要自己 JSON.stringify、自己设 header，Axios 把这些默认行为都封好了", "p": "r-1-5-4"}, {"t": "常见坑：发给后端却报 415 Unsupported Media Type，多半是 Content-Type 没设成 application/json", "p": "r-1-5-5"}, {"t": "常见坑：路径写成相对路径时，基准是当前页面地址；页面地址变了就会 404，建议统一从配置里读 baseURL", "p": "r-1-5-6"}]}, {"t": "1.7 async/await：等待但不卡死", "p": "r-1-6", "details": [{"t": "知识点：async/await 异步等待——await 让异步代码读起来像同步，但底层仍然是「先挂起、结果回来再继续」", "p": "r-1-6-0"}, {"t": "详细过程：register() 声明成 async，里面 const res = await axios.post(...)；执行到 await 时函数暂停，把控制权交回浏览器，页面仍可滚动、仍可点别的", "p": "r-1-6-1"}, {"t": "关键细节：await 挂起的是「当前 async 函数」，不是整个页面——所以不会像同步请求那样把界面冻住", "p": "r-1-6-2"}, {"t": "等价写法：不写 async/await 就用 axios.post(...).then(res => {...}).catch(err => {...})，本质上一样", "p": "r-1-6-3"}, {"t": "关键细节：必须用 try/catch 包住 await，否则网络错误会变成未捕获异常，提示框弹不出来", "p": "r-1-6-4"}, {"t": "常见坑：忘了写 await，拿到的是 Promise 对象而不是响应数据，后面 res.data 全是 undefined", "p": "r-1-6-5"}]}, {"t": "1.8 JSON：前端与后端唯一都认的数据格式", "p": "r-1-7", "details": [{"t": "知识点：JSON 格式——一种纯文本的数据交换格式，键值对 + 数组，语言无关", "p": "r-1-7-0"}, {"t": "为什么不用 JS 对象直接发：网络只能传字节流；JSON 是文本，能安全穿过 HTTP 请求体", "p": "r-1-7-1"}, {"t": "JSON 与 JS 对象的区别：JSON 的键必须用双引号；不能有注释；不能有 undefined；不能有函数", "p": "r-1-7-2"}, {"t": "详细过程：浏览器里 { username: \"wuji\", password: \"123\" } 是 JS 对象", "p": "r-1-7-3"}, {"t": "详细过程：发出后变成文本 {\"username\":\"wuji\",\"password\":\"123\"} 这才是 JSON", "p": "r-1-7-4"}, {"t": "常见坑：后端返回的字段名和前端.js 里写的对不上（比如 note_date 与 noteDate），页面一片空白", "p": "r-1-7-5"}]}]}, {"idx": 2, "title": "阶段二：网络传输（HTTP 协议）", "color": "#0E7490", "items": [{"t": "2.1 建立连接：先握手再说话", "p": "r-2-0", "details": [{"t": "知识点：TCP 三次握手——HTTP 建立在 TCP 之上；发请求前先建立可靠连接", "p": "r-2-0-0"}, {"t": "详细过程：客户端发 SYN → 服务端回 SYN+ACK → 客户端回 ACK，连接建立后才会发 HTTP 报文", "p": "r-2-0-1"}, {"t": "关键细节：本机访问 127.0.0.1 走 loopback，不经过网卡，所以几乎无延迟", "p": "r-2-0-2"}, {"t": "关键细节：HTTP/1.1 默认 keep-alive，连接可复用，不是每个请求都重新握手", "p": "r-2-0-3"}]}, {"t": "2.2 HTTP 请求报文：三个部分一个空行", "p": "r-2-1", "details": [{"t": "知识点：请求行——格式是「方法 + 路径 + 协议版本」", "p": "r-2-1-0"}, {"t": "详细过程：请求行实例——POST /api/users/register HTTP/1.1", "p": "r-2-1-1"}, {"t": "知识点：请求头——一组「键: 值」，告诉服务器这次请求的元信息", "p": "r-2-1-2"}, {"t": "详细过程：请求头关键项——Host：目标主机和端口", "p": "r-2-1-3"}, {"t": "详细过程：请求头关键项——Content-Type: application/json：请求体是 JSON，这是后端能否用 @RequestBody 解析的关键", "p": "r-2-1-4"}, {"t": "详细过程：请求头关键项——Content-Length：请求体的字节长度", "p": "r-2-1-5"}, {"t": "详细过程：请求头关键项——Accept: application/json：希望返回 JSON", "p": "r-2-1-6"}, {"t": "详细过程：请求头关键项——User-Agent：浏览器身份", "p": "r-2-1-7"}, {"t": "详细过程：请求头关键项——Cookie：若已登录，会话信息在这里", "p": "r-2-1-8"}, {"t": "知识点：空行——请求头和请求体之间的分界线，一个空行，告诉服务器「头结束了」", "p": "r-2-1-9"}, {"t": "知识点：请求体——真正要传的业务数据，只在 POST/PUT 里有", "p": "r-2-1-10"}, {"t": "详细过程：请求体实例——{\"username\":\"wuji\",\"password\":\"123\"}", "p": "r-2-1-11"}, {"t": "关键细节：请求头里能看出「是什么格式」，请求体里才是「内容」，两者配合才能正确解析", "p": "r-2-1-12"}]}, {"t": "2.3 POST 与 GET 的区别：为什么注册必须用 POST", "p": "r-2-2", "details": [{"t": "知识点：参数位置不同——GET 把参数拼在 URL 的问号后面（query string）；POST 把参数放在请求体里", "p": "r-2-2-0"}, {"t": "知识点：语义不同——GET 用于「取」，应该是只读、可重复的；POST 用于「提交」，会改变服务器状态", "p": "r-2-2-1"}, {"t": "知识点：安全性不同——GET 参数暴露在 URL 里，会被浏览器历史、日志、代理服务器记录；POST 放在 body 里相对隐蔽", "p": "r-2-2-2"}, {"t": "关键细节：注意「相对隐蔽」不等于「安全」——POST 照样可以被抓包，真正安全要靠 HTTPS", "p": "r-2-2-3"}, {"t": "知识点：长度限制不同——GET 受 URL 长度限制（不同浏览器几千字符）；POST 理论上没有硬限制", "p": "r-2-2-4"}, {"t": "知识点：缓存与幂等不同——GET 可被缓存、可重复执行结果不变（幂等）；POST 一般不被缓存、重复执行会产生多条数据（非幂等）", "p": "r-2-2-5"}, {"t": "详细过程：对照表——注册用 POST：/api/users/register + body 里放 username/password", "p": "r-2-2-6"}, {"t": "详细过程：对照表——查询用户用 GET：/api/users?page=1&size=10", "p": "r-2-2-7"}, {"t": "常见坑：用 GET 传密码，密码直接出现在 URL 和访问日志里，属于低级安全事故", "p": "r-2-2-8"}]}, {"t": "2.4 URL 的拆解：请求到底发到哪", "p": "r-2-3", "details": [{"t": "知识点：URL 结构——协议://主机:端口/路径?查询参数#锚点", "p": "r-2-3-0"}, {"t": "详细过程：http://127.0.0.1:8080/api/users/register", "p": "r-2-3-1"}, {"t": "逐段拆解：http：协议", "p": "r-2-3-2"}, {"t": "逐段拆解：127.0.0.1：主机（本机回环地址）", "p": "r-2-3-3"}, {"t": "逐段拆解：8080：端口，对应 SpringBoot 内嵌 Tomcat 的监听端口", "p": "r-2-3-4"}, {"t": "逐段拆解：/api/users/register：路径，SpringMVC 就是靠它查路由表的", "p": "r-2-3-5"}, {"t": "关键细节：端口不对会直接连接被拒（ERR_CONNECTION_REFUSED），根本不是 404——两者要分清", "p": "r-2-3-6"}]}, {"t": "2.5 跨域与预检：本地开发的高频坑", "p": "r-2-4", "details": [{"t": "知识点：同源策略——浏览器的安全策略：协议 + 域名 + 端口三者完全相同才算同源，否则 Ajax 被拦", "p": "r-2-4-0"}, {"t": "知识点：CORS——服务端通过响应头 Access-Control-Allow-Origin 等声明「允许哪些来源访问」", "p": "r-2-4-1"}, {"t": "详细过程：若前端跑在 5173、后端在 8080，就是跨域；浏览器会先发一个 OPTIONS 预检请求，服务端允许后才发真正的 POST", "p": "r-2-4-2"}, {"t": "关键细节：这是浏览器的限制，不是服务器的限制——用 Postman 直接调接口不会跨域，因为 Postman 不是浏览器", "p": "r-2-4-3"}, {"t": "常见坑：file:// 协议下打开页面，Ajax 一律失败：这是本地文件跨域限制，必须用本地服务器打开", "p": "r-2-4-4"}]}]}, {"idx": 3, "title": "阶段三：后端接客与参数解析（SpringBoot + SpringMVC + Controller）", "color": "#7C3AED", "items": [{"t": "3.1 SpringBoot 启动类：一切的起点", "p": "r-3-0", "details": [{"t": "知识点：@SpringBootApplication——它是三个注解的合体：@SpringBootConfiguration + @EnableAutoConfiguration + @ComponentScan", "p": "r-3-0-0"}, {"t": "逐个解释：@SpringBootConfiguration：声明这是配置类", "p": "r-3-0-1"}, {"t": "逐个解释：@EnableAutoConfiguration：自动配置，按依赖推断要装配什么（比如引了 web 依赖就自动配 Tomcat）", "p": "r-3-0-2"}, {"t": "逐个解释：@ComponentScan：从启动类所在包向下扫描所有 @Component/@Service/@Repository/@RestController", "p": "r-3-0-3"}, {"t": "详细过程：main 方法里调 SpringApplication.run(XxxApplication.class, args)，容器启动、Bean 创建、Tomcat 拉起", "p": "r-3-0-4"}, {"t": "关键细节：包的位置很关键——启动类必须放在所有业务类的「父包」下，否则扫不到——这就是为什么 Controller 注入 Service 会变成 null 的常见原因", "p": "r-3-0-5"}]}, {"t": "3.2 内嵌 Tomcat：不用单独装服务器", "p": "r-3-1", "details": [{"t": "知识点：内嵌 Tomcat——SpringBoot 把 Tomcat 打进了 jar 里，启动应用就等于启动服务器", "p": "r-3-1-0"}, {"t": "详细过程：启动日志里会出现 Tomcat started on port 8080 和 Started XxxApplication in x.xx seconds", "p": "r-3-1-1"}, {"t": "为什么可以内嵌：传统做法是把 war 丢进外部 Tomcat；SpringBoot 反过来把容器作为依赖引入，做到「一个 jar 就能跑」", "p": "r-3-1-2"}, {"t": "关键细节：端口可在 application.yml 里改 server.port；被占用时启动会直接失败，报 Port 8080 was already in use", "p": "r-3-1-3"}, {"t": "关键细节：Tomcat 内部用线程池处理请求，每个请求占一个线程，所以 Service 里不要写死循环或长阻塞", "p": "r-3-1-4"}]}, {"t": "3.3 请求进入 Tomcat：从字节流到 Request 对象", "p": "r-3-2", "details": [{"t": "知识点：Connector 与线程池——Tomcat 的 Connector 组件监听端口，收到 TCP 数据后交给工作线程处理", "p": "r-3-2-0"}, {"t": "详细过程：Tomcat 解析 HTTP 报文，把请求行、请求头、请求体封装成 HttpServletRequest 对象，响应封装成 HttpServletResponse", "p": "r-3-2-1"}, {"t": "关键细节：到这里 Tomcat 并不知道「用户注册」是什么业务，它只管把报文解析成对象", "p": "r-3-2-2"}]}, {"t": "3.4 SpringMVC 路由分发：DispatcherServlet 是总调度", "p": "r-3-3", "details": [{"t": "知识点：DispatcherServlet——SpringMVC 的前端控制器（Front Controller），所有请求的入口，负责统筹而不是自己干活", "p": "r-3-3-0"}, {"t": "详细过程：请求先到 DispatcherServlet → 它问 HandlerMapping「这个路径该谁处理」→ HandlerMapping 查路由表 → 返回对应的 Controller 方法", "p": "r-3-3-1"}, {"t": "关键细节：路由表是启动时扫出来的：扫描所有 @RequestMapping/@GetMapping/@PostMapping，建立「路径 + 方法 → 处理函数」的映射", "p": "r-3-3-2"}, {"t": "常见坑：路径对得上但请求方法不对（代码写 @PostMapping、你发的是 GET），会返回 405 Method Not Allowed——这是接口层面最容易被误判成 404 的错误", "p": "r-3-3-3"}]}, {"t": "3.5 路由映射的两种写法", "p": "r-3-4", "details": [{"t": "知识点：类级 + 方法级组合——类上写 @RequestMapping(\"/api/users\") 作为前缀，方法上写 @PostMapping(\"/register\")", "p": "r-3-4-0"}, {"t": "详细过程：最终路径——两者拼接得到 /api/users/register，这才和前端 axios 里的 url 对上", "p": "r-3-4-1"}, {"t": "另一种写法：方法上直接写完整路径 @PostMapping(\"/api/users/register\")，效果一样但不利于统一管理", "p": "r-3-4-2"}, {"t": "关键细节：路径前有没有斜杠、末尾有没有斜杠，都可能影响匹配，团队要统一约定", "p": "r-3-4-3"}]}, {"t": "3.6 @RestController：告诉 Spring「我是接口」", "p": "r-3-5", "details": [{"t": "知识点：@RestController——等于 @Controller + @ResponseBody 的组合注解", "p": "r-3-5-0"}, {"t": "拆开看：@Controller：声明这是一个控制器，要被 Spring 管理", "p": "r-3-5-1"}, {"t": "拆开看：@ResponseBody：方法返回值不再当「视图名」解析，而是直接写进响应体", "p": "r-3-5-2"}, {"t": "详细过程：返回一个 User 对象，Spring 用 Jackson 自动把它序列化成 JSON 字符串放进响应体", "p": "r-3-5-3"}, {"t": "关键细节：如果用 @Controller 而忘了 @ResponseBody，Spring 会把返回值当模板名去找页面，结果报 404 或视图解析错误——这是新手最常见的坑之一", "p": "r-3-5-4"}]}, {"t": "3.7 @PostMapping：只接 POST", "p": "r-3-6", "details": [{"t": "知识点：@PostMapping——限定只有 POST 请求才进这个方法，是 @RequestMapping(method = RequestMethod.POST) 的简写", "p": "r-3-6-0"}, {"t": "详细过程：@PostMapping(\"/register\") 贴在方法上，表示「/register 且是 POST」才匹配", "p": "r-3-6-1"}, {"t": "家族成员：@GetMapping / @PostMapping / @PutMapping / @DeleteMapping 分别对应查/增/改/删，和 RESTful 风格一一对应", "p": "r-3-6-2"}, {"t": "常见坑：前端用了 axios.get 而后端写的是 @PostMapping，报 405；反过来也一样", "p": "r-3-6-3"}]}, {"t": "3.8 @RequestBody：把 JSON 变成 Java 对象", "p": "r-3-7", "details": [{"t": "知识点：@RequestBody——告诉 Spring「把请求体整个读出来，转成这个参数类型的对象」", "p": "r-3-7-0"}, {"t": "详细过程：方法签名写 public Result register(@RequestBody User user)，Spring 会：", "p": "r-3-7-1"}, {"t": "详细过程：第一步——读取请求体里的 JSON 字符串", "p": "r-3-7-2"}, {"t": "详细过程：第二步——根据 Content-Type 选择 HttpMessageConverter（JSON 对应 Jackson 的 MappingJackson2HttpMessageConverter）", "p": "r-3-7-3"}, {"t": "详细过程：第三步——Jackson 把 JSON 的键和 User 的属性名逐一匹配、反序列化成 new User(...)", "p": "r-3-7-4"}, {"t": "关键细节：这就是为什么前端字段名和后端实体属性名必须一致——不一致就映射不上，拿到 null", "p": "r-3-7-5"}, {"t": "关键细节：Content-Type 必须是 application/json，否则会报 415 Unsupported Media Type", "p": "r-3-7-6"}, {"t": "与 @RequestParam 的区别：@RequestParam 取的是 URL 上的参数或表单字段（key=value）；@RequestBody 取的是请求体的整体内容", "p": "r-3-7-7"}, {"t": "与 @PathVariable 的区别：@PathVariable 取的是路径里的占位（/users/{id}）；@RequestBody 取的是 body", "p": "r-3-7-8"}, {"t": "常见坑：一个方法里既想接 body 又想接 query 参数是可以的，但不能写两个 @RequestBody", "p": "r-3-7-9"}]}, {"t": "3.9 Controller 的职责边界：接客不干活", "p": "r-3-8", "details": [{"t": "知识点：Controller 层是「前台」——只做三件事：接收参数、调用 Service、包装返回结果", "p": "r-3-8-0"}, {"t": "详细过程：Controller 里不应该出现 SQL、不应该出现复杂判断、不应该出现事务 —— 那些都属于 Service", "p": "r-3-8-1"}, {"t": "关键细节：Controller 保持薄，一旦业务变复杂，改 Service 就够了，接口层不用动", "p": "r-3-8-2"}]}]}, {"idx": 4, "title": "阶段四：业务处理与依赖注入（Service + IOC/DI）", "color": "#047857", "items": [{"t": "4.1 IOC：对象创建权交给容器", "p": "r-4-0", "details": [{"t": "知识点：IOC（控制反转）——传统写法是「我要用什么，我自己 new」；IOC 是「我要用什么，容器给我」", "p": "r-4-0-0"}, {"t": "反转了什么：反转的是「对象的创建权与生命周期管理权」——从程序员手里转到了 Spring 容器", "p": "r-4-0-1"}, {"t": "详细过程：Spring 启动时扫描到 @Service、@RestController、@Repository、@Component、@Mapper，把它们实例化成对象放进容器，这些对象统称 Bean", "p": "r-4-0-2"}, {"t": "为什么要这么做：一是解耦（换个实现类不用改调用方）；二是统一管理（生命周期、作用域、AOP 增强都集中处理）", "p": "r-4-0-3"}]}, {"t": "4.2 @Service：把类注册成 Bean", "p": "r-4-1", "details": [{"t": "知识点：@Service——语义上标记「这是一个业务层组件」，本质上和 @Component 一样，都是让容器扫描并实例化", "p": "r-4-1-0"}, {"t": "详细过程：在 UserServiceImpl 类上加 @Service，Spring 启动时就会创建它的实例放进容器", "p": "r-4-1-1"}, {"t": "关键细节：默认单例——一个 @Service 类在容器里只有一个实例，被所有请求共享；所以不要在 Service 里用成员变量存「这个请求的数据」，会串数据", "p": "r-4-1-2"}, {"t": "家族成员：@Controller/@RestController 用于接口层，@Service 用于业务层，@Repository 用于持久层，@Component 是通用兜底", "p": "r-4-1-3"}]}, {"t": "4.3 @Autowired：依赖注入，替代手动 new", "p": "r-4-2", "details": [{"t": "知识点：@Autowired（DI 依赖注入）——声明「这个字段需要的对象，请容器帮我注入进来」", "p": "r-4-2-0"}, {"t": "详细过程：对比两种写法——老写法：private UserService userService = new UserServiceImpl();", "p": "r-4-2-1"}, {"t": "详细过程：对比两种写法——新写法：@Autowired private UserService userService;", "p": "r-4-2-2"}, {"t": "关键细节：注意注入的是「接口类型」而不是实现类——这就是利用多态解耦：以后把 UserServiceImpl 换成 UserServiceImplV2，Controller 一行都不用改", "p": "r-4-2-3"}, {"t": "注入方式：字段注入——直接标在字段上，写法最简，但不利于单元测试", "p": "r-4-2-4"}, {"t": "注入方式：构造器注入——把依赖作为构造参数，Spring 自动传入；官方推荐，因为依赖不可变（final）、便于测试、能早暴露循环依赖", "p": "r-4-2-5"}, {"t": "关键细节：@Autowired 默认按「类型」找 Bean；同类型有多个时要用 @Qualifier 指定名字，或 @Primary 标记首选", "p": "r-4-2-6"}, {"t": "常见坑：注入到的是 null，通常三个原因：类没加 @Service/@Repository；类不在启动类扫描范围内；Bean 还没创建就用了", "p": "r-4-2-7"}]}, {"t": "4.4 Controller 调用 Service：进入业务层", "p": "r-4-3", "details": [{"t": "详细过程：Controller 里 userService.register(user) 一行调用，控制权交给 Service", "p": "r-4-3-0"}, {"t": "关键细节：这一行「看起来很简单」，但背后是：Spring 已经提前把 UserService 的实例准备好并注入到 Controller 里了", "p": "r-4-3-1"}]}, {"t": "4.5 Service 里的业务逻辑：真正「有脑子」的一层", "p": "r-4-4", "details": [{"t": "知识点：业务校验——即便前端校验过，后端仍然要再校验一遍：用户名非空、长度合规、密码强度", "p": "r-4-4-0"}, {"t": "为什么后端还要校验：前端可以绕过（Postman 直接调接口），所以后端才是真正的安全边界", "p": "r-4-4-1"}, {"t": "知识点：唯一性检查——先查库里是否已存在同名用户，存在就抛业务异常（用户名已存在）", "p": "r-4-4-2"}, {"t": "关键细节：严格来说「先查再插」在高并发下有竞态问题，真正可靠的做法是数据库唯一索引兜底", "p": "r-4-4-3"}, {"t": "知识点：密码加密——绝不能明文存库；常见做法是 BCrypt（自带盐、可调强度）或 MD5+随机盐", "p": "r-4-4-4"}, {"t": "关键细节：加密后存的是密文，登录时是把「用户输入的密码」用同样规则算出密文再比对，不是解密", "p": "r-4-4-5"}, {"t": "知识点：事务——如果注册涉及多张表（用户表 + 用户角色表），要加 @Transactional，保证要么全成功要么全回滚", "p": "r-4-4-6"}, {"t": "知识点：业务异常——校验不通过时抛自定义异常（如 ApiException），交给全局异常处理器统一转成错误响应", "p": "r-4-4-7"}]}, {"t": "4.6 Service 调用 Mapper：业务层不写 SQL", "p": "r-4-5", "details": [{"t": "详细过程：Service 里调用 userMapper.insert(user)，把「持久化」这件事委托出去", "p": "r-4-5-0"}, {"t": "关键细节：Service 只关心「要保存这个用户」，不关心「SQL 怎么写、连接从哪来」——这就是分层带来的好处", "p": "r-4-5-1"}]}]}, {"idx": 5, "title": "阶段五：数据持久化（MyBatis + HikariCP + MySQL）", "color": "#C2410C", "items": [{"t": "5.1 @Mapper 接口：只有签名，没有实现", "p": "r-5-0", "details": [{"t": "知识点：@Mapper——标记这是一个 MyBatis 的持久层接口，告诉 MyBatis「启动时请为它生成实现」", "p": "r-5-0-0"}, {"t": "详细过程：写 public interface UserMapper { int insert(User user); } —— 只有方法签名，没有方法体", "p": "r-5-0-1"}, {"t": "关键细节：@Mapper 可以逐接口标注，也可以在启动类上用 @MapperScan 批量扫描包", "p": "r-5-0-2"}]}, {"t": "5.2 动态代理：实现类是运行时生成的", "p": "r-5-1", "details": [{"t": "知识点：MyBatis 动态代理——MyBatis 用 JDK 动态代理（java.lang.reflect.Proxy）在运行时生成接口的实现类对象", "p": "r-5-1-0"}, {"t": "详细过程：调用 userMapper.insert(user) 时，实际进入的是代理对象的 invoke 方法，代理再根据「接口名 + 方法名」找到对应的 SQL 并执行", "p": "r-5-1-1"}, {"t": "关键细节：所以 Mapper 接口不需要你写实现类；但这也意味着「接口名 / 方法名 / namespace / id」必须严丝合缝对上，否则报 Invalid bound statement (not found)", "p": "r-5-1-2"}, {"t": "关键细节：代理对象同样被注册进 Spring 容器，所以 Service 里可以用 @Autowired 注入它", "p": "r-5-1-3"}]}, {"t": "5.3 SQL 映射：注解写还是 XML 写", "p": "r-5-2", "details": [{"t": "知识点：注解方式——在方法上直接写 @Insert(\"insert into user(username, password) values(#{username}, #{password})\")", "p": "r-5-2-0"}, {"t": "知识点：XML 方式——在 resources/mapper/UserMapper.xml 里写 mapper + insert，namespace 指向接口全限定名、id 等于方法名", "p": "r-5-2-1"}, {"t": "怎么选：简单 SQL 用注解；复杂/动态 SQL（if、where、foreach）用 XML，可读性更好", "p": "r-5-2-2"}, {"t": "关键细节：XML 必须放在 mybatis.mapper-locations 配置的路径下（如 classpath:mapper/*.xml），否则打包后找不到", "p": "r-5-2-3"}]}, {"t": "5.4 #{} 占位符：防 SQL 注入的关键", "p": "r-5-3", "details": [{"t": "知识点：#{} 预编译占位符——MyBatis 把 #{username} 编译成 JDBC 的 ?，交给 PreparedStatement 设参", "p": "r-5-3-0"}, {"t": "详细过程：最终执行的 SQL 是 INSERT INTO user(username, password) VALUES(?, ?)", "p": "r-5-3-1"}, {"t": "为什么能防注入：因为 SQL 的「结构」在预编译阶段就固定了，用户输入只作为「值」被传入，不会被当成 SQL 语法的一部分", "p": "r-5-3-2"}, {"t": "对比 ${} 字符串拼接：${} 是直接文本替换，如果用户输入 ' or '1'='1，整条语句语义就被改掉", "p": "r-5-3-3"}, {"t": "详细过程：注入攻击示例——假设 SQL 是 select * from user where username = '${username}'，输入 ' or '1'='1 后变成 where username = '' or '1'='1'，条件永远成立", "p": "r-5-3-4"}, {"t": "关键细节：结论：99% 的场景用 #{}；只有表名、字段名这类「不能用 ? 替代」的地方才考虑 ${}，而且必须自己做白名单校验", "p": "r-5-3-5"}, {"t": "这个坑你踩过两次：前端用 innerHTML 拼用户输入会 XSS；SQL 用字符串拼接会注入 —— 本质都是「把数据当代码执行」", "p": "r-5-3-6"}]}, {"t": "5.5 HikariCP 连接池：借连接而不是造连接", "p": "r-5-4", "details": [{"t": "知识点：为什么需要连接池——建立一次数据库连接要做网络握手、身份认证、分配资源，成本很高；每个请求都新建连接，高并发下会把数据库拖死", "p": "r-5-4-0"}, {"t": "知识点：连接池机制——应用启动时预先建好一批连接放进池子；用时「借出」，用完「归还」，而不是关闭", "p": "r-5-4-1"}, {"t": "详细过程：MyBatis 执行 SQL 前向 HikariCP 借一个 Connection → 执行 → 归还", "p": "r-5-4-2"}, {"t": "关键细节：SpringBoot 引入 JDBC/MyBatis 依赖后默认就用 HikariCP，不需要额外配置；application.yml 里可调最大连接数、超时等", "p": "r-5-4-3"}, {"t": "关键细节：连接池的参数本质是「并发上限」：池子满了，后来的请求只能排队等", "p": "r-5-4-4"}]}, {"t": "5.6 执行 INSERT：DML 与事务", "p": "r-5-5", "details": [{"t": "知识点：DML 语句——INSERT 属于 DML（数据操作语言），影响的是「数据行」而不是「表结构」", "p": "r-5-5-0"}, {"t": "详细过程：PreparedStatement 设好两个参数 → executeUpdate() 执行 → MySQL 写入数据页并更新索引", "p": "r-5-5-1"}, {"t": "关键细节：数据库默认 autocommit=true，一条 DML 执行完立即提交；如果加了 @Transactional，则要在方法结束时统一提交", "p": "r-5-5-2"}, {"t": "知识点：主键回填——如果是自增主键，需要配置 useGeneratedKeys=true + keyProperty=\"id\"，插入后新 id 会回填到传入的 User 对象上", "p": "r-5-5-3"}, {"t": "关键细节：不配回填，插入完你就拿不到新记录的 id，后续想用 id 做跳转或关联就没法做", "p": "r-5-5-4"}]}, {"t": "5.7 结果映射：数据库的行变成 Java 的对象", "p": "r-5-6", "details": [{"t": "知识点：结果映射——查询时 MySQL 返回 ResultSet（结果集），MyBatis 负责把「一行」映射成「一个 Java 对象」", "p": "r-5-6-0"}, {"t": "详细过程：INSERT 的返回——插入方法通常声明返回 int，值等于「受影响的行数」；返回 0 说明一条都没插进去", "p": "r-5-6-1"}, {"t": "详细过程：查询的返回——select 方法声明返回 User 或 List<User>，MyBatis 按列名匹配属性名自动填充", "p": "r-5-6-2"}, {"t": "关键细节：列名 user_name 与属性名 userName 默认映射不上，需要在 SQL 里 as 起别名，或开启 map-underscore-to-camel-case", "p": "r-5-6-3"}, {"t": "常见坑：同一条 SQL 在数据库工具里查得到数据，程序里对象却全是 null —— 多半就是命名没对上", "p": "r-5-6-4"}]}]}, {"idx": 6, "title": "阶段六：响应返回与前端渲染（HTTP Response + Axios）", "color": "#BE123C", "items": [{"t": "6.1 Service 返回结果给 Controller", "p": "r-6-0", "details": [{"t": "详细过程：userService.register(user) 执行完返回（void 或 int 或其他），Controller 拿到这个结果", "p": "r-6-0-0"}, {"t": "关键细节：如果 Service 里抛了异常，流程不会走到这里，而是直接进入全局异常处理分支", "p": "r-6-0-1"}]}, {"t": "6.2 统一响应封装：Result 是前后端的「契约」", "p": "r-6-1", "details": [{"t": "知识点：统一响应结果类——把所有接口的返回都统一成 { code, msg, data } 三段式", "p": "r-6-1-0"}, {"t": "为什么需要统一：前端只需要写一套解析逻辑：先看 code，再决定取 data 还是弹 msg；不用为每个接口写不同的判断", "p": "r-6-1-1"}, {"t": "详细过程：Controller 返回 Result.success(\"注册成功\")，或 Result.error(\"用户名已存在\")", "p": "r-6-1-2"}, {"t": "关键细节：code 的约定要固定下来：0 或 200 表示成功，非 0 表示失败；失败时要带上可读的 msg", "p": "r-6-1-3"}, {"t": "对照你的项目：知识库后端的接口就返回统一结构，出错时由 @RestControllerAdvice 统一转成错误 JSON，前端不用逐个接口写 try", "p": "r-6-1-4"}]}, {"t": "6.3 @RestController 序列化：Result 对象变 JSON", "p": "r-6-2", "details": [{"t": "知识点：Jackson 序列化——Spring 内置 Jackson，把 Java 对象转成 JSON 字符串", "p": "r-6-2-0"}, {"t": "详细过程：Result 对象的 code/msg/data 三个属性 → {\"code\":0,\"msg\":\"注册成功\",\"data\":null}", "p": "r-6-2-1"}, {"t": "关键细节：serialization 时对象里的 null 字段默认会被写成 null；日期默认是时间戳或 ISO 格式，必要时用 @JsonFormat 指定格式", "p": "r-6-2-2"}]}, {"t": "6.4 HTTP 响应报文：状态行 + 响应头 + 响应体", "p": "r-6-3", "details": [{"t": "知识点：状态行——格式是「协议版本 + 状态码 + 状态描述」", "p": "r-6-3-0"}, {"t": "详细过程：状态行实例——HTTP/1.1 200 OK", "p": "r-6-3-1"}, {"t": "知识点：响应头——Content-Type: application/json;charset=UTF-8（告诉浏览器这是 JSON，别乱解析）", "p": "r-6-3-2"}, {"t": "详细过程：响应头关键项——Content-Length：响应体字节长度", "p": "r-6-3-3"}, {"t": "详细过程：响应头关键项——Date：服务器时间", "p": "r-6-3-4"}, {"t": "详细过程：响应头关键项——Set-Cookie：需要建立会话时在这里下发 Cookie", "p": "r-6-3-5"}, {"t": "知识点：响应体——真正的业务数据，就是那段 JSON", "p": "r-6-3-6"}, {"t": "详细过程：响应体实例——{\"code\":0,\"msg\":\"注册成功\",\"data\":null}", "p": "r-6-3-7"}]}, {"t": "6.5 状态码：HTTP 层的「一句话结论」", "p": "r-6-4", "details": [{"t": "知识点：200 OK——请求成功，业务是否成功还要看响应体里的 code", "p": "r-6-4-0"}, {"t": "知识点：201 Created——资源创建成功（新增接口更规范的做法）；很多项目统一用 200，但要和前端约定好", "p": "r-6-4-1"}, {"t": "知识点：400 Bad Request——请求参数有问题，比如 JSON 格式错、必填字段缺失", "p": "r-6-4-2"}, {"t": "知识点：401 / 403——未认证 / 已认证但无权限", "p": "r-6-4-3"}, {"t": "知识点：404 Not Found——路径找不到——注意区分「路径错」与「端口错」，端口错是连接被拒", "p": "r-6-4-4"}, {"t": "知识点：405 Method Not Allowed——路径对了但请求方法不对（该 POST 发了 GET）", "p": "r-6-4-5"}, {"t": "知识点：415 Unsupported Media Type——Content-Type 不对，@RequestBody 解析不了", "p": "r-6-4-6"}, {"t": "知识点：500 Internal Server Error——服务端代码抛了未被捕获的异常，比如空指针、SQL 语法错、连接池耗尽", "p": "r-6-4-7"}, {"t": "关键细节：一句话区分：4xx 是「你的请求有问题」，5xx 是「我的服务器有问题」", "p": "r-6-4-8"}]}, {"t": "6.6 全局异常处理：别让 500 直接甩给用户", "p": "r-6-5", "details": [{"t": "知识点：@RestControllerAdvice + @ExceptionHandler——统一捕获 Controller 层抛出的异常，转成规范的 JSON 响应", "p": "r-6-5-0"}, {"t": "详细过程：自定义异常（如用户名已存在）→ 被 @ExceptionHandler 捕获 → 返回 400 + {code:xxx, msg:\"用户名已存在\"}", "p": "r-6-5-1"}, {"t": "关键细节：没有全局处理时，未捕获异常会导致 500 并可能把堆栈信息暴露给前端，既不友好也不安全", "p": "r-6-5-2"}]}, {"t": "6.7 Tomcat 发回响应", "p": "r-6-6", "details": [{"t": "详细过程：Tomcat 把响应对象序列化成 HTTP 响应报文字节流，通过 TCP 连接写回浏览器", "p": "r-6-6-0"}, {"t": "关键细节：如果前面是跨域请求，Tomcat 返回时还要带上 CORS 相关响应头，否则浏览器仍然会拦", "p": "r-6-6-1"}]}, {"t": "6.8 前端接收：await 恢复执行", "p": "r-6-7", "details": [{"t": "知识点：Promise 的 resolve——网络响应回来后，之前挂起的 await 恢复执行，axios 把响应包装成 response 对象", "p": "r-6-7-0"}, {"t": "详细过程：const res = await axios.post(...)；res 里有 status（HTTP 状态码）、data（响应体 JSON 解析后的对象）", "p": "r-6-7-1"}, {"t": "关键细节：axios 已经帮你做了 JSON.parse；如果响应不是 JSON（比如返回 HTML 错误页），会解析失败", "p": "r-6-7-2"}, {"t": "关键细节：HTTP 状态码非 2xx 时，axios 默认会走 catch 而不是 then，需要用 try/catch 或在拦截器里统一处理", "p": "r-6-7-3"}]}, {"t": "6.9 判断与渲染：把结果变成用户能看懂的东西", "p": "r-6-8", "details": [{"t": "详细过程：判断 res.data.code 是否为成功值", "p": "r-6-8-0"}, {"t": "成功分支：弹出「注册成功」提示 → 清空表单 → 延迟跳转到登录页（路由跳转而不是 window.location，避免整页刷新）", "p": "r-6-8-1"}, {"t": "失败分支：把 res.data.msg 显示在页面上（比如「用户名已存在」），让用户知道下一步该改什么", "p": "r-6-8-2"}, {"t": "关键细节：loading 状态要在这时关闭（无论成功失败），否则按钮会一直转圈", "p": "r-6-8-3"}, {"t": "关键细节：提示信息要具体，「操作失败」这种话对用户毫无帮助", "p": "r-6-8-4"}]}]}], "extra": [{"idx": 0, "title": "阶段〇：全景速览（先建立全局认知）", "color": "#475569", "items": [{"t": "0.1 一句话主线：用户在前端点「注册」→ 浏览器把数据打成 HTTP 请求发出去 → 内嵌 Tomcat 收到 → SpringMVC 按路由找到 Controller → Controller 调 Service 做业务 → Service 调 Mapper → MyBatis 生成 SQL 交给连接池执行 → MySQL 落库 → 结果原路返回 → 前端拿到 JSON 渲染提示", "p": "r-0-0", "details": []}, {"t": "0.2 六段式时间轴（严格按此顺序）", "p": "r-0-1", "details": [{"t": "阶段一：前端采集与发送——前端：HTML 表单 → v-model 双向绑定 → 校验 → @click 触发 → 组装 JS 对象 → axios.post → await 挂起等待", "p": "r-0-1-0"}, {"t": "阶段二：网络传输——网络：TCP 建连 → HTTP 请求报文（请求行 + 请求头 + 空行 + 请求体）→ 到达服务器端口", "p": "r-0-1-1"}, {"t": "阶段三：后端接收与参数解析——后端：内嵌 Tomcat 监听 → DispatcherServlet 拦截 → HandlerMapping 查路由 → @PostMapping 命中 → @RequestBody 反序列化", "p": "r-0-1-2"}, {"t": "阶段四：业务处理与依赖注入——业务：@Autowired 拿到 Service Bean → @Service 里的业务校验 → 调 Mapper", "p": "r-0-1-3"}, {"t": "阶段五：数据持久化——持久层：@Mapper 动态代理 → #{} 预编译 → HikariCP 借连接 → INSERT → 返回受影响行数 → 归还连接", "p": "r-0-1-4"}, {"t": "阶段六：响应返回——响应：封装 Result → Jackson 转 JSON → 200 状态码 → Tomcat 发回 → 前端 await 恢复 → 判断 code → 提示/跳转", "p": "r-0-1-5"}]}, {"t": "0.3 四个角色与各自的语言", "p": "r-0-2", "details": [{"t": "浏览器（前端）：只懂 JS 对象、JSON、HTTP；不关心数据库长什么样", "p": "r-0-2-0"}, {"t": "Tomcat（容器）：只懂 TCP 连接、HTTP 报文；不关心业务", "p": "r-0-2-1"}, {"t": "Spring（框架）：负责路由、参数转换、对象创建、依赖注入；把杂乱的基础工作收走", "p": "r-0-2-2"}, {"t": "MySQL（数据库）：只懂 SQL；不关心是谁在问、为什么要问", "p": "r-0-2-3"}]}, {"t": "0.4 一次注册请求的耗时分层（体感）", "p": "r-0-3", "details": [{"t": "前端处理：输入、校验、序列化：约 1ms 以内，肉眼无感", "p": "r-0-3-0"}, {"t": "网络往返：本机 loopback 约 1~3ms；公网 20~200ms", "p": "r-0-3-1"}, {"t": "后端处理：路由 + 业务 + SQL 解析：约 5~30ms", "p": "r-0-3-2"}, {"t": "数据库写入：INSERT + 索引更新 + 事务提交：约 1~10ms", "p": "r-0-3-3"}, {"t": "渲染反馈：弹提示、跳转：约 1ms", "p": "r-0-3-4"}]}]}, {"idx": 7, "title": "附录 A：全链路文字时序图", "color": "#475569", "items": [{"t": "A.1 正常流程（逐步）", "p": "r-7-0", "details": [{"t": "步骤 1：用户输入 → v-model 同步到 form.username / form.password", "p": "r-7-0-0"}, {"t": "步骤 2：点击按钮 → @click 触发 register()", "p": "r-7-0-1"}, {"t": "步骤 3：前端校验通过 → 组装 data 对象", "p": "r-7-0-2"}, {"t": "步骤 4：axios.post('/api/users/register', data) → 序列化成 JSON", "p": "r-7-0-3"}, {"t": "步骤 5：浏览器发出 HTTP 请求：请求行 + 请求头（Content-Type: application/json）+ 空行 + 请求体", "p": "r-7-0-4"}, {"t": "步骤 6：TCP 连接建立 → 请求到达 127.0.0.1:8080", "p": "r-7-0-5"}, {"t": "步骤 7：Tomcat 解析报文 → 封装成 HttpServletRequest", "p": "r-7-0-6"}, {"t": "步骤 8：DispatcherServlet → HandlerMapping 查到 UserController.register 方法", "p": "r-7-0-7"}, {"t": "步骤 9：@RequestBody 用 Jackson 把 JSON 反序列化成 User 对象", "p": "r-7-0-8"}, {"t": "步骤 10：@Autowired 注入的 UserService 被调用 → 执行业务校验与加密", "p": "r-7-0-9"}, {"t": "步骤 11：Service 调用 @Autowired 注入的 UserMapper（动态代理对象）", "p": "r-7-0-10"}, {"t": "步骤 12：MyBatis 找到对应 SQL，#{} 编译成 ?，从 HikariCP 借连接", "p": "r-7-0-11"}, {"t": "步骤 13：执行 INSERT → MySQL 写入磁盘 → 返回受影响行数", "p": "r-7-0-12"}, {"t": "步骤 14：连接归还池中 → int 结果一路上传：Mapper → Service → Controller", "p": "r-7-0-13"}, {"t": "步骤 15：Controller 封装 Result.success(\"注册成功\")", "p": "r-7-0-14"}, {"t": "步骤 16：Jackson 序列化成 JSON → 写入 HTTP 响应体 → 状态码 200", "p": "r-7-0-15"}, {"t": "步骤 17：Tomcat 发回浏览器 → await 恢复 → 判断 code → 提示并跳转", "p": "r-7-0-16"}]}]}, {"idx": 8, "title": "附录 B：常见错误对照表", "color": "#2563EB", "items": [{"t": "B.1 前端侧", "p": "r-8-0", "details": [{"t": "页面不刷新 / 数据不变：v-model 绑定的字段未在 data 中声明，或字段名写错", "p": "r-8-0-0"}, {"t": "请求根本没发出：按钮在 form 内且未 preventDefault，触发了页面刷新；或 @click 方法名写错", "p": "r-8-0-1"}, {"t": "请求 404：axios 的 url 与后端 @RequestMapping 拼出来的路径不一致", "p": "r-8-0-2"}, {"t": "请求 405：请求方法与后端注解不匹配（GET 打了 @PostMapping）", "p": "r-8-0-3"}, {"t": "请求 415：Content-Type 不是 application/json，或没传 body", "p": "r-8-0-4"}, {"t": "拿到 undefined：await 漏写，res 还是个 Promise", "p": "r-8-0-5"}, {"t": "报跨域错误：前后端不同源且后端没配 CORS；或页面是 file:// 打开的", "p": "r-8-0-6"}]}, {"t": "B.2 后端侧", "p": "r-8-1", "details": [{"t": "启动失败 Port already in use：8080 被占用，改 server.port 或杀掉占用进程", "p": "r-8-1-0"}, {"t": "注入的 Service 为 null：类没加 @Service，或不在启动类扫描的包范围内", "p": "r-8-1-1"}, {"t": "收到的参数全是 null：前端字段名与实体属性名不一致；或漏了 @RequestBody", "p": "r-8-1-2"}, {"t": "Invalid bound statement (not found)：XML 的 namespace 不是接口全限定名、select 的 id 与方法名不一致，或 XML 不在 mapper-locations 路径", "p": "r-8-1-3"}, {"t": "查得到数据但对象全 null：数据库下划线命名与 Java 驼峰命名没做映射", "p": "r-8-1-4"}, {"t": "500 空指针：Service 里没判空就调用了方法，或注入失败", "p": "r-8-1-5"}, {"t": "中文乱码：数据库/表不是 utf8mb4，或连接串没指定字符集", "p": "r-8-1-6"}, {"t": "时间差 8 小时：连接串没配 serverTimezone=Asia/Shanghai", "p": "r-8-1-7"}]}]}, {"idx": 9, "title": "附录 C：面试高频追问", "color": "#0E7490", "items": [{"t": "C.1 为什么 Controller 不直接操作数据库", "p": "r-9-0", "details": [{"t": "答案要点：职责分离：Controller 负责协议层（接参、返参），Service 负责业务规则与事务边界，Mapper 负责 SQL；分层让「改业务」和「改 SQL」互不影响，也让单元测试更可行", "p": "r-9-0-0"}]}, {"t": "C.2 @Autowired 注入的是接口，能调用吗", "p": "r-9-1", "details": [{"t": "答案要点：能。Spring 注入的是接口的「实现类实例」，通过多态调用；这也是面向接口编程的价值——换实现不用改调用方", "p": "r-9-1-0"}]}, {"t": "C.3 #{} 和 ${} 到底差在哪", "p": "r-9-2", "details": [{"t": "答案要点：#{} 编译成 JDBC 的 ? 走预编译，值永远是值；${} 是文本替换，值可能变成语法的一部分。前者安全，后者只在表名/字段名这类无法用 ? 的场景使用，且必须白名单校验", "p": "r-9-2-0"}]}, {"t": "C.4 为什么有了 JDBC 还要 MyBatis", "p": "r-9-3", "details": [{"t": "答案要点：JDBC 一个查询要写连接、PreparedStatement、设参、遍历 ResultSet、关资源，模板代码占了大头；MyBatis 把模板收走，只留「接口方法 + SQL」，本质是「把重复收进壳里」", "p": "r-9-3-0"}]}, {"t": "C.5 连接池解决了什么问题", "p": "r-9-4", "details": [{"t": "答案要点：建连接成本高（握手、认证、分配资源），连接池把连接复用起来，用「借/还」代替「建/销」，把开销从「每请求一次」降到「启动时一批」", "p": "r-9-4-0"}]}, {"t": "C.6 一次请求经过了多少层", "p": "r-9-5", "details": [{"t": "答案要点：浏览器 → TCP → Tomcat → DispatcherServlet → HandlerMapping → Controller → Service → Mapper 代理 → MyBatis → 连接池 → MySQL → 原路返回。每层只做自己的事，靠「约定」（路径、字段名、返回结构）串起来", "p": "r-9-5-0"}]}]}, {"idx": 10, "title": "附录 D：这张图怎么用", "color": "#7C3AED", "items": [{"t": "D.1 顺向背一遍：从阶段一读到阶段六，每个阶段问自己：「这一层的输入是什么、输出是什么、出了什么错」", "p": "r-10-0", "details": []}, {"t": "D.2 逆向查一遍：从报错倒推：看到 404 想「路径匹配」，看到 405 想「请求方法」，看到 500 想「服务端异常」，看到 null 想「字段映射」", "p": "r-10-1", "details": []}, {"t": "D.3 画一遍再讲一遍：合上这张图，自己在纸上画出六段式，然后对着空气讲给「一个不懂的人」听——能讲通，才算真会", "p": "r-10-2", "details": []}]}]};

function isCJK(ch){ return /[\u3000-\u303f\u4e00-\u9fff\uff00-\uffef]/.test(ch); }
/* 用 canvas 真实测量文字宽度（比按字符估算准得多） */
const _mc = document.createElement("canvas").getContext("2d");
function textW(s, fs, weight){
  const fam = getComputedStyle(document.body).fontFamily;
  _mc.font = `${weight || 600} ${fs}px ${fam}`;
  return _mc.measureText(s).width;
}
function fit1(s, fs, budget, weight){
  if (textW(s, fs, weight) <= budget) return s;
  let out = s;
  while (out.length > 1 && textW(out+"…", fs, weight) > budget) out = out.slice(0,-1);
  return out + "…";
}
function tokenize(s){
  // CJK/标点 单字成词；英文按空格切词（空格并入前一词，作为断行点）
  const out = []; let buf = "";
  for (const ch of s){
    if (isCJK(ch)){
      if (buf){ out.push(buf); buf = ""; }
      out.push(ch);
    } else if (ch === " "){
      buf += ch; out.push(buf); buf = "";
    } else {
      buf += ch;
    }
  }
  if (buf) out.push(buf);
  // 收尾标点并到前一个词，避免“）”单独占一行
  const merged = [];
  for (const tk of out){
    if (merged.length && /^[）】」』，。、；：？！\)\]%]+$/.test(tk)) merged[merged.length-1] += tk;
    else merged.push(tk);
  }
  return merged;
}
function wrap2(s, fs, budget, maxL, weight){
  const toks = tokenize(s), lines = []; let cur = "";
  for (const tk of toks){
    const test = cur + tk;
    if (cur && textW(test, fs, weight) > budget){
      lines.push(cur); cur = tk;
      if (lines.length >= maxL){ cur = ""; break; }
    } else cur = test;
  }
  if (cur && lines.length < maxL) lines.push(cur);
  // 用「去空白后的字符数」判断是否真的有内容没放下（避免空格导致误判）
  const full = toks.join("").replace(/\s/g, "");
  const used = lines.join("").replace(/\s/g, "");
  if (used.length < full.length && lines.length){
    let last = lines[lines.length-1];
    while (last.length > 1 && textW(last+"…", fs, weight) > budget) last = last.slice(0,-1);
    lines[lines.length-1] = last + "…";
  }
  return lines;
}

const LS_SEEDED = "mm-marks-seeded-v1";
function seedAuthorMarks(){
  try{
    if (localStorage.getItem(LS_SEEDED)) return 0;
    if (Object.keys(state.marks).length){ localStorage.setItem(LS_SEEDED, "1"); return 0; }
    const keys = Object.keys(MARK_DEFAULTS || {});
    if (!keys.length){ localStorage.setItem(LS_SEEDED, "1"); return 0; }
    state.marks = JSON.parse(JSON.stringify(MARK_DEFAULTS));
    saveMarks();
    localStorage.setItem(LS_SEEDED, "1");
    return keys.length;
  }catch(e){ return 0; }
}
function loadAuthorMarks(){
  const keys = Object.keys(MARK_DEFAULTS || {});
  if (!keys.length){ alert("这个页面没有内置标记数据。"); return; }
  if (Object.keys(state.marks).length &&
      !confirm("会用作者内置的 " + keys.length + " 条标记覆盖你当前的标记，继续？")) return;
  state.marks = JSON.parse(JSON.stringify(MARK_DEFAULTS));
  saveMarks();
  localStorage.setItem(LS_SEEDED, "1");
  render(true); updateStats();
}
try { state.marks = JSON.parse(localStorage.getItem(LS_KEY) || "{}") || {}; }
catch(e){ state.marks = {}; }
function saveMarks(){ try { localStorage.setItem(LS_KEY, JSON.stringify(state.marks)); } catch(e){} }
function markOf(p){ return state.marks[p] || 0; }
function cycleMark(p){
  const next = (markOf(p) + 1) % 4;
  if (next === 0) delete state.marks[p];
  else state.marks[p] = next;
  saveMarks();
  render(true);
  updateStats();
}
function updateStats(){
  const c = [0,0,0,0];
  DATA.main.forEach(st => st.items.forEach(it => {
    if (it.details.length) it.details.forEach(d => c[markOf(d.p)]++);
    else c[markOf(it.p)]++;
  }));
  const box = document.getElementById("stats");
  if (!box) return;
  box.innerHTML =
      `<span><i class="dot" style="background:${MARK_COLORS[1]}"></i>不会 <b>${c[1]}</b></span>`
    + `<span><i class="dot" style="background:${MARK_COLORS[2]}"></i>仅了解 <b>${c[2]}</b></span>`
    + `<span><i class="dot" style="background:${MARK_COLORS[3]}"></i>理解 <b>${c[3]}</b></span>`
    + `<span style="opacity:.65">未标记 <b>${c[0]}</b></span>`;
}
function markBtn(parent, px, py, path, r){
  const mk = markOf(path);
  const g = el("g", { class:"mk" });
  g.appendChild(el("circle", {
    cx:px, cy:py, r:r || 7,
    fill: mk ? MARK_COLORS[mk] : "#ffffff",
    stroke: mk ? MARK_COLORS[mk] : "#c3c9d2",
    "stroke-width": mk ? 1 : 1.2,
    "stroke-dasharray": mk ? "0" : "2 2"
  }));
  if (mk){
    const t = el("text", { x:px, y:py+0.4, "text-anchor":"middle",
      "font-size":8.5, "font-weight":800, fill:"#ffffff" });
    t.textContent = mk === 3 ? "✓" : (mk === 2 ? "~" : "✕");
    g.appendChild(t);
  }
  const ttl = el("title", {});
  ttl.textContent = `【${MARK_NAMES[mk]}】点击切换：不会 → 仅了解 → 理解 → 取消`;
  g.appendChild(ttl);
  g.addEventListener("click", ev => { ev.stopPropagation(); cycleMark(path); });
  parent.appendChild(g);
}
const CONTENT = { w:0, h:0, y0:0 };
const NS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("map");
const scene = document.getElementById("scene");
function el(tag, attrs){ const e = document.createElementNS(NS, tag); for(const k in attrs) e.setAttribute(k, attrs[k]); return e; }
function txt(x, y, s, size, fill, weight, anchor){
  const t = el("text", { x, y, "font-size":size, fill, "font-weight":weight||400 });
  if (anchor) t.setAttribute("text-anchor", anchor);
  t.textContent = s; return t;
}

function render(keepView){
  const keep = keepView ? { s:state.scale, x:state.tx, y:state.ty } : null;
  scene.innerHTML = "";
  const main = DATA.main;

  // ---------- 计算每列高度 ----------
  const cols = main.map((st, i) => {
    const stageCollapsed = state.collapsedStage.has(i);
    let y = CARD_H + HEAD_GAP;
    const items = [];
    if (!stageCollapsed){
      st.items.forEach((it, j) => {
        const key = i + "-" + j;
        const itemOpen = !state.collapsedItem.has(key) && it.details.length > 0;
        const itemLines = wrap2(it.t, FS_ITEM, ITEM_W - 36, 99, 600);   // 不再截断
        const itemH = itemLines.length * (FS_ITEM*1.32) + 13;
        const itemY = y;
        y += itemH + ITEM_GAP;
        const dets = [];
        if (itemOpen){
          it.details.forEach((d, k) => {
            const dl = wrap2(d.t, FS_DETAIL, DETAIL_W - 42, 99, 400);       // 不再截断
            const dh = dl.length * (FS_DETAIL*1.3) + 9;
            dets.push({ y, lines:dl, h:dh, p:d.p });
            y += dh + DETAIL_GAP;
          });
        }
        items.push({ it, j, key, y:itemY, h:itemH, lines:itemLines, open:itemOpen, dets });
      });
    }
    return { st, i, items, height: Math.max(y, CARD_H + HEAD_GAP) };
  });

  const maxH = Math.max(...cols.map(c => c.height));
  const topPad = 42;
  const chainY = topPad;
  const colX = (i) => i * (CARD_W + COL_GAP);

  // ---------- 阶段之间的箭头（先画，压在卡片下面）----------
  const gE = el("g", {});
  for (let i = 0; i < main.length - 1; i++){
    const x1 = colX(i) + CARD_W + 6;
    const x2 = colX(i+1) - 6;
    const y = chainY + CARD_H/2;
    gE.appendChild(el("line", {
      x1, y1:y, x2, y2:y, stroke:"#94a3b8", "stroke-width":1.8,
      "marker-end":"url(#arw)"
    }));
    gE.appendChild(txt((x1+x2)/2, topPad - 15, FLOW[i] || "", 10.5, "#7c8798", 700, "middle"));
  }
  // 回流箭头：阶段六 -> 前端（下方虚线）
  const retY = topPad + maxH + 34;
  const rx1 = colX(main.length-1) + CARD_W/2;
  const rx2 = colX(0) + CARD_W/2;
  gE.appendChild(el("path", {
    d:`M ${rx1} ${topPad+maxH+6} L ${rx1} ${retY} L ${rx2} ${retY} L ${rx2} ${topPad+maxH+18}`,
    fill:"none", stroke:"#cbb8a6", "stroke-width":1.6, "stroke-dasharray":"5 4",
    "marker-end":"url(#arwR)"
  }));
  gE.appendChild(txt((rx1+rx2)/2, retY - 10, "响应 JSON + 200 回到前端，渲染提示", 10.5, "#a08b76", 600, "middle"));
  scene.appendChild(gE);

  // ---------- 每列 ----------
  const gN = el("g", {});
  cols.forEach((col, i) => {
    const x = colX(i);
    const st = col.st;
    const stageCollapsed = state.collapsedStage.has(i);

    // 阶段卡
    const g = el("g", { });
    g.appendChild(el("rect", {
      x, y:chainY, width:CARD_W, height:CARD_H, rx:12,
      fill:CAPTION_BG(i, st.color), stroke:st.color, "stroke-width":0
    }));
    // 序号徽章
    g.appendChild(el("circle", { cx:x+22, cy:chainY+CARD_H/2, r:11, fill:"rgba(255,255,255,.22)" }));
    g.appendChild(txt(x+22, chainY+CARD_H/2+0.5, String(i+1), 11.5, "#fff", 800, "middle"));
    // 标题（最多 2 行）
    const lines = wrap2(st.title.replace(/^阶段[一二三四五六七八九十]+：/, ""), FS_STAGE, CARD_W-80, 3, 700);
    const lh = FS_STAGE*1.26;
    const sy = chainY + CARD_H/2 - (lines.length-1)*lh/2;
    lines.forEach((ln, k) => {
      g.appendChild(txt(x+42, sy + k*lh, ln, FS_STAGE, "#fff", 700));
    });
    // 折叠指示
    g.appendChild(el("circle", { cx:x+CARD_W-14, cy:chainY+14, r:7, fill:"rgba(255,255,255,.9)", stroke:"none" }));
    g.appendChild(txt(x+CARD_W-14, chainY+14.5, stageCollapsed ? String(st.items.length) : "−", 9, st.color, 800, "middle"));
    g.style.cursor = "pointer";
    g.addEventListener("click", ev => {
      ev.stopPropagation();
      if (state.collapsedStage.has(i)) state.collapsedStage.delete(i);
      else state.collapsedStage.add(i);
      render();
    });
    gN.appendChild(g);

    // 竖线：阶段卡 -> 环节
    if (!stageCollapsed && col.items.length){
      const firstY = col.items[0].y;
      gN.appendChild(el("line", {
        x1:x+34, y1:chainY+CARD_H+2, x2:x+34, y2:firstY,
        stroke:st.color, "stroke-width":1.4, opacity:.35
      }));
    }

    // 环节
    col.items.forEach(row => {
      const cx = x + 8;
      const gI = el("g", {});
      gI.appendChild(el("rect", {
        x:cx, y:row.y, width:ITEM_W, height:row.h, rx:7,
        fill:"#fff", stroke:st.color, "stroke-width":1, "stroke-opacity":.45
      }));
      gI.appendChild(el("rect", { x:cx, y:row.y+5, width:3, height:row.h-10, rx:1.5, fill:st.color }));
      const ilh = FS_ITEM*1.32;
      const isy = row.y + row.h/2 - (row.lines.length-1)*ilh/2;
      row.lines.forEach((ln,k) => {
        gI.appendChild(txt(cx+12, isy + k*ilh, ln, FS_ITEM, "#1f2937", 600));
      });
      if (row.it.details.length){
        gI.appendChild(el("circle", { cx:cx+ITEM_W-13, cy:row.y+row.h/2, r:6, fill:"#fff", stroke:st.color, "stroke-width":1, "stroke-opacity":.7 }));
        gI.appendChild(txt(cx+ITEM_W-13, row.y+row.h/2+0.5, row.open ? "−" : String(row.it.details.length), 8, st.color, 700, "middle"));
      } else {
        /* 无细节的环节 = 叶子，加学习状态按钮 */
        markBtn(gI, cx+ITEM_W-13, row.y+row.h/2, row.it.p, 6.5);
      }
      gI.style.cursor = "pointer";
      gI.addEventListener("click", ev => {
        ev.stopPropagation();
        if (!row.it.details.length) return;
        if (state.collapsedItem.has(row.key)) state.collapsedItem.delete(row.key);
        else state.collapsedItem.add(row.key);
        render();
      });
      gN.appendChild(gI);

      // 细节
      row.dets.forEach(dd => {
        const dmk = markOf(dd.p);
        gN.appendChild(el("rect", {
          x:cx+14, y:dd.y, width:DETAIL_W, height:dd.h, rx:5,
          fill: dmk ? MARK_TINTS[dmk] : "#f6f4ef",
          stroke: dmk ? MARK_COLORS[dmk] : st.color,
          "stroke-width": dmk ? 1.4 : .8,
          "stroke-opacity": dmk ? .9 : .28
        }));
        const dlh = FS_DETAIL*1.3;
        const dsy = dd.y + dd.h/2 - (dd.lines.length-1)*dlh/2;
        dd.lines.forEach((ln,kk) => {
          gN.appendChild(txt(cx+22, dsy + kk*dlh, ln, FS_DETAIL, dmk === 1 ? "#b91c1c" : "#5b6472", 400));
        });
        markBtn(gN, cx+14+DETAIL_W-13, dd.y+dd.h/2, dd.p, 6.5);
      });
    });
  });
  scene.appendChild(gN);

  if (keep){ state.scale = keep.s; state.tx = keep.x; state.ty = keep.y; apply(); }
  else { CONTENT.w = 0; }

  // 记录精确内容框，供 fit() 使用（getBBox 在这种大量分组下不准）
  CONTENT.w = (main.length-1)*(CARD_W+COL_GAP) + CARD_W;
  CONTENT.y0 = 0;
  CONTENT.h = topPad + maxH + 46;
  if (keep){ state.scale = keep.s; state.tx = keep.x; state.ty = keep.y; apply(); }
  else fit();
  updateStats();
}

function CAPTION_BG(i, c){
  // 直接用阶段色，稍作区分
  return c;
}

/* ---------- 缩放/平移 ---------- */
function apply(){
  scene.setAttribute("transform", `translate(${state.tx},${state.ty}) scale(${state.scale})`);
  document.getElementById("zoomval").textContent = Math.round(state.scale*100)+"%";
}
function fit(){
  const W = svg.clientWidth, H = svg.clientHeight;
  const clean = (new URLSearchParams(location.search)).get("clean") === "1";
  const padX = clean ? 40 : 54, padTop = clean ? 34 : 78, padBottom = 46;
  if (!CONTENT.w) return;
  const s = Math.min((W-padX*2)/CONTENT.w, (H-padTop-padBottom)/CONTENT.h, 3);
  state.scale = Math.max(s, 0.12);
  const cw = CONTENT.w*state.scale, ch = CONTENT.h*state.scale;
  state.tx = Math.round((W - cw)/2);
  state.ty = Math.round(padTop + (H - padTop - padBottom - ch)/2 - CONTENT.y0*state.scale);
  apply();
  document.title = JSON.stringify({scale:state.scale,tx:state.tx,ty:state.ty,cw:CONTENT.w,ch:CONTENT.h,vw:svg.clientWidth,vh:svg.clientHeight});
}

svg.addEventListener("wheel", e => {
  e.preventDefault();
  const r = svg.getBoundingClientRect();
  const mx = e.clientX-r.left, my = e.clientY-r.top;
  const k = e.deltaY < 0 ? 1.12 : 1/1.12;
  const ns = Math.min(Math.max(state.scale*k, 0.08), 3);
  const q = ns/state.scale;
  state.tx = mx-(mx-state.tx)*q; state.ty = my-(my-state.ty)*q;
  state.scale = ns; apply();
}, { passive:false });

let drag=false, lx=0, ly=0;
svg.addEventListener("mousedown", e => { drag=true; lx=e.clientX; ly=e.clientY; svg.classList.add("dragging"); });
window.addEventListener("mousemove", e => { if(!drag) return; state.tx+=e.clientX-lx; state.ty+=e.clientY-ly; lx=e.clientX; ly=e.clientY; apply(); });
window.addEventListener("mouseup", () => { drag=false; svg.classList.remove("dragging"); });

document.getElementById("btn-expand").onclick = () => { state.collapsedStage.clear(); state.collapsedItem.clear(); render(); };
document.getElementById("btn-items").onclick = () => { state.collapsedStage.clear(); state.collapsedItem.clear();
  DATA.main.forEach((st,i) => st.items.forEach((it,j) => state.collapsedItem.add(i+"-"+j))); render(); };
document.getElementById("btn-collapse").onclick = () => { DATA.main.forEach((st,i) => state.collapsedStage.add(i)); render(); };
document.getElementById("btn-fit").onclick = () => render();
document.getElementById("btn-in").onclick = () => { state.scale = Math.min(state.scale*1.18,3); apply(); };
document.getElementById("btn-out").onclick = () => { state.scale = Math.max(state.scale/1.18,0.08); apply(); };
document.getElementById("btn-reset").onclick = () => {
  if (!confirm("确定清空所有学习状态标记？")) return;
  state.marks = {}; saveMarks();
  try { localStorage.setItem(LS_SEEDED, "1"); } catch(e){}
  render(true); updateStats();
};

/* ===== 标记导出 / 导入：用于同步到 U 盘 ===== */
function exportMarks(){
  const keys = Object.keys(state.marks);
  const payload = {
    app: "前后端数据沟通全链路-学习标记",
    version: 1,
    exportedAt: new Date().toISOString(),
    total: keys.length,
    marks: state.marks
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const d = new Date();
  const ymd = d.getFullYear() + "-" +
              String(d.getMonth()+1).padStart(2,"0") + "-" +
              String(d.getDate()).padStart(2,"0");
  const a = document.createElement("a");
  a.href = url;
  a.download = "学习标记-" + ymd + ".json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
  alert("已导出 " + keys.length + " 条标记\n\n文件名：学习标记-" + ymd + ".json\n（在浏览器下载目录里）\n\n把它拷到 U 盘，换电脑时用「导入标记」恢复。");
}

function importMarks(file){
  const fr = new FileReader();
  fr.onload = () => {
    try {
      const obj = JSON.parse(fr.result);
      const marks = obj.marks || obj;
      if (typeof marks !== "object" || marks === null || Array.isArray(marks)) throw new Error("不是有效的标记文件");
      const keys = Object.keys(marks).filter(k => /^r(-\d+)+$/.test(k) && marks[k] >= 1 && marks[k] <= 3);
      if (!keys.length) throw new Error("文件里没有可用的标记");
      if (!confirm("将导入 " + keys.length + " 条标记。\n\n规则：同一知识点以导入文件为准，其余保留你当前的标记。\n\n继续？")) return;
      keys.forEach(k => { state.marks[k] = marks[k]; });
      saveMarks(); render(true); updateStats();
      alert("导入完成。\n当前共 " + Object.keys(state.marks).length + " 条标记。");
    } catch (e) {
      alert("导入失败：" + e.message + "\n\n请确认选的是「导出标记」生成的 json 文件。");
    }
  };
  fr.readAsText(file, "utf-8");
}

const _authorBtn = document.getElementById("btn-author");
if (_authorBtn) _authorBtn.onclick = loadAuthorMarks;
document.getElementById("btn-export").onclick = exportMarks;
document.getElementById("btn-import").onclick = () => document.getElementById("file-import").click();
document.getElementById("file-import").addEventListener("change", ev => {
  const f = ev.target.files && ev.target.files[0];
  if (f) importMarks(f);
  ev.target.value = "";
});


/* 默认：展开到环节（细节折叠）；?detail=1 则全部展开 */
(function(){
  state.collapsedStage.clear(); state.collapsedItem.clear();
  const wantDetail = (new URLSearchParams(location.search)).get("detail") === "1";
  if (!wantDetail){
    DATA.main.forEach((st,i) => st.items.forEach((it,j) => { if (it.details.length) state.collapsedItem.add(i+"-"+j); }));
  }
})();
/* 净图模式：?clean=1 隐藏 UI，便于导出海报 */
if ((new URLSearchParams(location.search)).get("clean") === "1"){
  document.querySelector(".topbar").style.display = "none";
  document.querySelector(".hint").style.display = "none";
  document.body.style.backgroundImage = "none";
}
/* 首次访问：把作者标记作为初始状态 */
const _seeded = seedAuthorMarks();
if (_seeded){
  const _h = document.querySelector(".hint");
  if (_h) _h.innerHTML += ' · <b>已载入作者 ' + _seeded + ' 条标记</b>';
}
render();
window.addEventListener("resize", () => { clearTimeout(window._t); window._t = setTimeout(apply, 120); });
</script>
